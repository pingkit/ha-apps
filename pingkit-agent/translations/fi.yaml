configuration:
  PINGKIT_CLAIM_CODE:
    name: "Parituskoodi"
    description: "8-merkkinen koodi, jonka iPhonesi PingKit näyttää kohdassa Agentit, Lisää agentti. Se toimii kerran ja vanhenee 10 minuutissa; voit tyhjentää sen parituksen jälkeen."
  PINGKIT_PORT:
    name: "Tilasivun portti"
    description: "Tilasivun portti (HTTP). Oletus 7474."
  PINGKIT_API_PORT:
    name: "iPhone-yhteyden portti"
    description: "HTTPS-portti, jonka kautta iPhonesi yhdistää agenttiin. Oletus 7475."
  PINGKIT_BIND:
    name: "Kuunteluosoite"
    description: "Tilasivun osoite. Oletus 0.0.0.0. iPhone-yhteys kuuntelee aina kaikissa liitännöissä."
  PINGKIT_IFACE:
    name: "Verkkoliitäntä"
    description: "Seurattava liitäntä, esimerkiksi end0 tai eth0. Oletus on oletusreitin liitäntä."
  PINGKIT_SWEEP_INTERVAL:
    name: "Skannausväli (sekuntia)"
    description: "Sekunnit verkkosi aktiivisten skannausten välillä. Oletus 900 (15 minuuttia)."
  PINGKIT_ARP_INTERVAL:
    name: "Naapuritaulun lukuväli (sekuntia)"
    description: "Sekunnit naapuritaulun (ARP) lukujen välillä. Oletus 30."
  PINGKIT_PING_INTERVAL:
    name: "Internettarkistuksen väli (sekuntia)"
    description: "Sekunnit internettarkistusten välillä. Oletus 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Internettarkistuksen osoitteet"
    description: "Yhdestä neljään IP-osoitetta pilkuilla erotettuina. Oletus 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto käyttää pingiä, missä järjestelmä sallii, ja muuten ARP- ja TCP-tarkistuksia; off ei pingaa koskaan."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto kuuntelee ja tekee agentin näkyväksi iPhonellesi; active vain lähettää kyselyjä, joten iPhonesi ei näe sitä; off poistaa Bonjourin käytöstä."
  PINGKIT_SSDP:
    name: "UPnP-haku (SSDP)"
    description: "Kuuntele UPnP-laitteita. Oletus on."
  PINGKIT_STATUS_PAGE:
    name: "Tilasivu"
    description: "off poistaa tilasivun kokonaan käytöstä. Oletus on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Laite offline -hälytykset"
    description: "Hälytä, kun laite poistuu verkostasi. Laite merkitään offline-tilaan kolmen väliin jääneen skannauksen jälkeen, mihin voi oletusvälillä kulua jopa 45 minuuttia. Oletus off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Väliin jääneet skannaukset ennen offline-tilaa"
    description: "Oletus 3."
  PINGKIT_LEARNING_DAYS:
    name: "Oppimispäivät"
    description: "Päivät, joiden aikana agentti oppii laitteesi ennen kuin Uusi laite -hälytykset alkavat. Oletus 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Hälytyksiä tunnissa"
    description: "Suurin määrä hälytyksiä, jonka agentti lähettää tunnissa. Oletus 60."
  PINGKIT_WORKER_URL:
    name: "Välityspalvelun osoite"
    description: "Vain kehitykseen. Jätä tyhjäksi."
  PINGKIT_LOG_LEVEL:
    name: "Lokitaso"
    description: "Oletus info."
  PINGKIT_LOG_FORMAT:
    name: "Lokimuoto"
    description: "json tai text. Oletus json."
  PINGKIT_LOCALE:
    name: "Tilasivun kieli"
    description: "Kielikoodi, kuten de tai pt-BR. Tyhjä: selaimen kieli, muuten englanti."
  PINGKIT_MQTT_URL:
    name: "MQTT-välittäjä"
    description: "Jätä tyhjäksi, niin käytetään Home Assistantin Mosquitto-sovellusta. Muuten mqtt://host:1883 tai mqtts://host:8883, tai off, jos MQTT:tä ei käytetä."
  PINGKIT_MQTT_USERNAME:
    name: "MQTT-käyttäjänimi"
    description: "Vain yllä nimetylle välittäjälle. Home Assistantin Mosquitto ei tarvitse tähän mitään."
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT-salasana"
    description: "Vain yllä nimetylle välittäjälle. Home Assistantin Mosquitto ei tarvitse tähän mitään."
  PINGKIT_MQTT_TRACKERS:
    name: "Läsnäoloseuranta"
    description: "personal antaa seurannan puhelimille, tableteille ja kaikelle, jolla on yksityinen Wi-Fi-osoite; all kaikille laitteille; none poistaa sen käytöstä."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Sekunteja ennen poissaoloa"
    description: "Kuinka kauan seurattu laite pysyy kotona viimeisen vastauksensa jälkeen, jotta lepotilassa oleva puhelin ei näytä poistuneen. Oletus 180."
  PINGKIT_NOTIFY_URLS:
    name: "Ilmoitusten kohteet"
    description: "Minne agentti lähettää hälytykset lisäksi: yksi URL-osoite riviä kohden palveluille ntfy, Telegram, Discord, Pushover, webhook tai Apprise. Tilausta ei tarvita."
  PINGKIT_SPEED_TEST:
    name: "Nopeustesti"
    description: "daily ajaa yhden testin päivässä satunnaisella minuutilla ja silloin, kun pyydät sitä iPhonesta; manual vain kun pyydät, datakatolla rajoitetulle yhteydelle; off ei aja testiä koskaan."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Nopeustestin datakiintiö"
    description: "Enimmäismäärä, jonka nopeustestit saavat käyttää kalenterikuukaudessa, megatavuina. Kun se on käytetty, testiä ei aloiteta. Oletus 10000."
network:
  7474/tcp: "Tilasivu (HTTP)"
  7475/tcp: "iPhone-yhteys (HTTPS)"
