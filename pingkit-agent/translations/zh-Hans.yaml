# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "配对码"
    description: "你的 iPhone 上的 PingKit 在“代理”、“添加代理”中显示的 8 位代码。只能使用一次，10 分钟后过期；配对后可以清除。"
  PINGKIT_PORT:
    name: "状态页端口"
    description: "状态页的端口（HTTP）。默认 7474。"
  PINGKIT_API_PORT:
    name: "iPhone 连接端口"
    description: "你的 iPhone 连接代理所用的 HTTPS 端口。默认 7475。"
  PINGKIT_BIND:
    name: "监听地址"
    description: "状态页的地址。默认 0.0.0.0。iPhone 连接始终在所有接口上监听。"
  PINGKIT_IFACE:
    name: "网络接口"
    description: "要监控的接口，例如 end0 或 eth0。默认为默认路由所在的接口。"
  PINGKIT_SWEEP_INTERVAL:
    name: "扫描间隔（秒）"
    description: "主动扫描你的网络的间隔秒数。默认 900（15 分钟）。"
  PINGKIT_ARP_INTERVAL:
    name: "邻居表间隔（秒）"
    description: "读取邻居表（ARP）的间隔秒数。默认 30。"
  PINGKIT_PING_INTERVAL:
    name: "互联网检查间隔（秒）"
    description: "互联网检查的间隔秒数。默认 60。"
  PINGKIT_INTERNET_HOSTS:
    name: "互联网检查地址"
    description: "一到四个 IP 地址，以逗号分隔。默认 1.1.1.1,8.8.8.8。"
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto 在系统允许时使用 ping，否则使用 ARP 和 TCP 检查；off 从不 ping。"
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto 会监听并让你的 iPhone 看到代理；active 仅发送查询，因此你的 iPhone 看不到它；off 关闭 Bonjour。"
  PINGKIT_SSDP:
    name: "UPnP 发现（SSDP）"
    description: "监听 UPnP 设备。默认 on。"
  PINGKIT_STATUS_PAGE:
    name: "状态页"
    description: "off 会完全关闭状态页。默认 on。"
  PINGKIT_OFFLINE_ALERTS:
    name: "设备离线提醒"
    description: "设备离开你的网络时提醒。设备连续三次扫描未响应后会被报告为离线，按默认间隔最长可能需要 45 分钟。默认 off。"
  PINGKIT_OFFLINE_THRESHOLD:
    name: "判定离线前的未响应扫描次数"
    description: "默认 3。"
  PINGKIT_LEARNING_DAYS:
    name: "学习天数"
    description: "在新设备提醒开始前，代理学习你的设备的天数。默认 1。"
  PINGKIT_EVENTS_PER_HOUR:
    name: "每小时提醒数"
    description: "代理每小时最多发送的提醒数。默认 60。"
  PINGKIT_WORKER_URL:
    name: "中继地址"
    description: "仅供开发使用。请留空。"
  PINGKIT_LOG_LEVEL:
    name: "日志级别"
    description: "默认 info。"
  PINGKIT_LOG_FORMAT:
    name: "日志格式"
    description: "json 或 text。默认 json。"
  PINGKIT_LOCALE:
    name: "状态页语言"
    description: "语言代码，例如 de 或 pt-BR。留空则跟随浏览器语言，不支持时使用英文。"
  PINGKIT_MQTT_URL:
    name: "MQTT 服务器"
    description: "留空则使用 Home Assistant 中的 Mosquitto 应用。否则填写 mqtt://host:1883 或 mqtts://host:8883，填 off 则不使用 MQTT。"
  PINGKIT_MQTT_USERNAME:
    name: "MQTT 用户名"
    description: "仅用于上面指定的 MQTT 服务器。Home Assistant 中的 Mosquitto 无需在此填写。"
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT 密码"
    description: "仅用于上面指定的 MQTT 服务器。Home Assistant 中的 Mosquitto 无需在此填写。"
  PINGKIT_MQTT_TRACKERS:
    name: "在家跟踪器"
    description: "personal 为手机、平板电脑和使用私有 Wi-Fi 地址的任何设备创建跟踪器；all 为每台设备创建；none 关闭跟踪器。"
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "判定离家前的秒数"
    description: "被跟踪设备在最后一次响应后仍算在家的时长，避免休眠的手机被视为离家。默认 180。"
  PINGKIT_NOTIFY_URLS:
    name: "通知目标"
    description: "代理还会将提醒发送到这些位置：每行一个 URL，可用于 ntfy、Telegram、Discord、Pushover、Webhook 或 Apprise。无需订阅。"
  PINGKIT_SPEED_TEST:
    name: "速度测试"
    description: "daily 每天在随机时间测试一次，并在你从 iPhone 请求时测试；manual 仅在你请求时测试，适用于有流量上限的连接；off 从不测试。"
  PINGKIT_SPEED_BUDGET_MB:
    name: "速度测试流量上限"
    description: "速度测试在一个自然月内最多可使用的流量，单位为兆字节。达到上限后不会再开始测试。默认 10000。"
network:
  7474/tcp: "状态页（HTTP）"
  7475/tcp: "iPhone 连接（HTTPS）"
