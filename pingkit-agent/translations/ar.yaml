configuration:
  PINGKIT_CLAIM_CODE:
    name: "رمز الإقران"
    description: "الرمز المكوّن من 8 أحرف الذي يعرضه PingKit على iPhone ضمن الوكلاء، إضافة وكيل. يصلح لمرة واحدة وتنتهي صلاحيته بعد 10 دقائق؛ يمكنك مسحه بعد الإقران."
  PINGKIT_PORT:
    name: "منفذ صفحة الحالة"
    description: "منفذ صفحة الحالة (HTTP). الافتراضي: 7474."
  PINGKIT_API_PORT:
    name: "منفذ اتصال iPhone"
    description: "منفذ HTTPS الذي يتصل عبره iPhone بالوكيل. الافتراضي: 7475."
  PINGKIT_BIND:
    name: "عنوان الاستماع"
    description: "عنوان صفحة الحالة. الافتراضي: 0.0.0.0. يستمع اتصال iPhone دائمًا على كل الواجهات."
  PINGKIT_IFACE:
    name: "واجهة الشبكة"
    description: "الواجهة المراد مراقبتها، مثل end0 أو eth0. الافتراضي: واجهة المسار الافتراضي."
  PINGKIT_SWEEP_INTERVAL:
    name: "الفاصل بين عمليات الفحص (بالثواني)"
    description: "الثواني بين عمليات الفحص النشطة لشبكتك. الافتراضي: 900 (15 دقيقة)."
  PINGKIT_ARP_INTERVAL:
    name: "فاصل قراءة جدول الجيران (بالثواني)"
    description: "الثواني بين قراءات جدول الجيران (ARP). الافتراضي: 30."
  PINGKIT_PING_INTERVAL:
    name: "فاصل فحص الإنترنت (بالثواني)"
    description: "الثواني بين عمليات فحص الإنترنت. الافتراضي: 60."
  PINGKIT_INTERNET_HOSTS:
    name: "عناوين فحص الإنترنت"
    description: "من عنوان إلى أربعة عناوين IP، مفصولة بفواصل. الافتراضي: 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "يستخدم auto الأمر ping حيث يسمح النظام، وإلا فحوص ARP وTCP؛ ولا يرسل off أي ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "يستمع auto ويجعل الوكيل مرئيًا لجهاز iPhone؛ ويكتفي active بإرسال الاستعلامات، فلا يراه iPhone؛ ويوقف off خدمة Bonjour."
  PINGKIT_SSDP:
    name: "اكتشاف UPnP (SSDP)"
    description: "الاستماع إلى إعلانات أجهزة UPnP. الافتراضي: on."
  PINGKIT_STATUS_PAGE:
    name: "صفحة الحالة"
    description: "يوقف off صفحة الحالة تمامًا. الافتراضي: on."
  PINGKIT_OFFLINE_ALERTS:
    name: "تنبيهات «الجهاز غير متصل»"
    description: "التنبيه عندما يغادر جهاز شبكتك. يُعدّ الجهاز غير متصل بعد ثلاث عمليات فحص متتالية دون استجابة، وقد يستغرق ذلك حتى 45 دقيقة مع الفاصل الافتراضي. الافتراضي: off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "عمليات الفحص دون استجابة قبل «غير متصل»"
    description: "الافتراضي: 3."
  PINGKIT_LEARNING_DAYS:
    name: "أيام التعلّم"
    description: "الأيام التي يتعرّف فيها الوكيل على أجهزتك قبل بدء تنبيهات «جهاز جديد». الافتراضي: 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "التنبيهات في الساعة"
    description: "أكبر عدد من التنبيهات يرسله الوكيل في ساعة. الافتراضي: 60."
  PINGKIT_WORKER_URL:
    name: "عنوان المُرحِّل"
    description: "للتطوير فقط. اتركه فارغًا."
  PINGKIT_LOG_LEVEL:
    name: "مستوى السجل"
    description: "الافتراضي: info."
  PINGKIT_LOG_FORMAT:
    name: "تنسيق السجل"
    description: "json أو text. الافتراضي: json."
  PINGKIT_LOCALE:
    name: "لغة صفحة الحالة"
    description: "رمز لغة مثل de أو pt-BR. فارغ: لغة المتصفح، وإلا الإنجليزية."
  PINGKIT_MQTT_URL:
    name: "وسيط MQTT"
    description: "اتركه فارغًا لاستخدام تطبيق Mosquitto في Home Assistant. وإلا فاكتب mqtt://host:1883 أو mqtts://host:8883، أو off لإيقاف MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "اسم مستخدم MQTT"
    description: "فقط للوسيط الذي حددته أعلاه. لا يحتاج Mosquitto في Home Assistant إلى شيء هنا."
  PINGKIT_MQTT_PASSWORD:
    name: "كلمة سر MQTT"
    description: "فقط للوسيط الذي حددته أعلاه. لا يحتاج Mosquitto في Home Assistant إلى شيء هنا."
  PINGKIT_MQTT_TRACKERS:
    name: "متتبعات التواجد"
    description: "يمنح personal الهواتف والأجهزة اللوحية وأي جهاز يستخدم عنوان Wi-Fi خاصًا متتبعًا؛ ويمنحه all لكل جهاز؛ ويوقفها none."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "ثوانٍ قبل اعتباره غائبًا"
    description: "المدة التي يبقى فيها الجهاز المتتبَّع في المنزل بعد آخر رد، حتى لا يُعد الهاتف في وضع السكون غائبًا. الافتراضي 180."
  PINGKIT_NOTIFY_URLS:
    name: "وجهات الإشعارات"
    description: "الأماكن الأخرى التي يرسل إليها الوكيل تنبيهاته: عنوان URL واحد في كل صف لـ ntfy أو Telegram أو Discord أو Pushover أو webhook أو Apprise. لا يلزم اشتراك."
  PINGKIT_SPEED_TEST:
    name: "اختبار السرعة"
    description: "daily: اختبار واحد يوميًا في دقيقة عشوائية، وعندما تطلبه من iPhone؛ manual: فقط عندما تطلبه، لاتصال له حد للبيانات؛ off: لا يُجرى أي اختبار."
  PINGKIT_SPEED_BUDGET_MB:
    name: "حد بيانات اختبار السرعة"
    description: "أقصى ما يمكن أن تستهلكه اختبارات السرعة في الشهر الميلادي، بالميغابايت. لا يبدأ أي اختبار بعد بلوغه. القيمة الافتراضية 10000."
network:
  7474/tcp: "صفحة الحالة (HTTP)"
  7475/tcp: "اتصال iPhone (HTTPS)"
