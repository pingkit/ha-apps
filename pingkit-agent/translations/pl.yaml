# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Kod parowania"
    description: "8-znakowy kod, który PingKit pokazuje na Twoim iPhonie w sekcji Agenci, Dodaj agenta. Działa raz i wygasa po 10 minutach; po sparowaniu możesz go usunąć."
  PINGKIT_PORT:
    name: "Port strony stanu"
    description: "Port strony stanu (HTTP). Domyślnie 7474."
  PINGKIT_API_PORT:
    name: "Port połączenia z iPhone'em"
    description: "Port HTTPS, przez który Twój iPhone łączy się z agentem. Domyślnie 7475."
  PINGKIT_BIND:
    name: "Adres nasłuchiwania"
    description: "Adres strony stanu. Domyślnie 0.0.0.0. Połączenie z iPhone'em zawsze nasłuchuje na wszystkich interfejsach."
  PINGKIT_IFACE:
    name: "Interfejs sieciowy"
    description: "Obserwowany interfejs, na przykład end0 lub eth0. Domyślnie: ten z trasą domyślną."
  PINGKIT_SWEEP_INTERVAL:
    name: "Odstęp skanowania (sekundy)"
    description: "Sekundy między aktywnymi skanowaniami Twojej sieci. Domyślnie 900 (15 minut)."
  PINGKIT_ARP_INTERVAL:
    name: "Odstęp odczytu tablicy sąsiadów (sekundy)"
    description: "Sekundy między odczytami tablicy sąsiadów (ARP). Domyślnie 30."
  PINGKIT_PING_INTERVAL:
    name: "Odstęp sprawdzania internetu (sekundy)"
    description: "Sekundy między sprawdzeniami internetu. Domyślnie 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Adresy do sprawdzania internetu"
    description: "Od jednego do czterech adresów IP, rozdzielonych przecinkami. Domyślnie 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto używa pinga tam, gdzie system na to pozwala, a w innym razie sprawdzeń ARP i TCP; off nigdy nie pinguje."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto nasłuchuje i sprawia, że agent jest widoczny dla Twojego iPhone'a; active tylko wysyła zapytania, więc Twój iPhone go nie widzi; off wyłącza Bonjour."
  PINGKIT_SSDP:
    name: "Wykrywanie UPnP (SSDP)"
    description: "Nasłuchuj urządzeń UPnP. Domyślnie on."
  PINGKIT_STATUS_PAGE:
    name: "Strona stanu"
    description: "off całkowicie wyłącza stronę stanu. Domyślnie on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Alerty „Urządzenie offline”"
    description: "Ostrzegaj, gdy urządzenie opuszcza Twoją sieć. Urządzenie jest zgłaszane jako offline po trzech pominiętych skanowaniach, co przy domyślnym odstępie może potrwać do 45 minut. Domyślnie off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Pominięte skanowania do stanu offline"
    description: "Domyślnie 3."
  PINGKIT_LEARNING_DAYS:
    name: "Dni nauki"
    description: "Dni, w których agent poznaje Twoje urządzenia, zanim zaczną się alerty „Nowe urządzenie”. Domyślnie 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Alerty na godzinę"
    description: "Maksymalna liczba alertów, które agent wysyła w ciągu godziny. Domyślnie 60."
  PINGKIT_WORKER_URL:
    name: "Adres przekaźnika"
    description: "Tylko do programowania. Zostaw puste."
  PINGKIT_LOG_LEVEL:
    name: "Poziom logowania"
    description: "Domyślnie info."
  PINGKIT_LOG_FORMAT:
    name: "Format logów"
    description: "json lub text. Domyślnie json."
  PINGKIT_LOCALE:
    name: "Język strony stanu"
    description: "Kod języka, na przykład de lub pt-BR. Puste: język przeglądarki, a w innym razie angielski."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Pozostaw puste, aby użyć aplikacji Mosquitto w Home Assistant. W innym razie mqtt://host:1883 lub mqtts://host:8883, albo off, aby wyłączyć MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Nazwa użytkownika MQTT"
    description: "Tylko dla brokera podanego powyżej. Mosquitto w Home Assistant niczego tu nie potrzebuje."
  PINGKIT_MQTT_PASSWORD:
    name: "Hasło MQTT"
    description: "Tylko dla brokera podanego powyżej. Mosquitto w Home Assistant niczego tu nie potrzebuje."
  PINGKIT_MQTT_TRACKERS:
    name: "Śledzenie obecności"
    description: "personal daje śledzenie telefonom, tabletom i wszystkiemu z prywatnym adresem Wi-Fi; all każdemu urządzeniu; none je wyłącza."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Sekundy do nieobecności"
    description: "Jak długo śledzone urządzenie pozostaje w domu po ostatniej odpowiedzi, aby uśpiony telefon nie wyglądał na nieobecny. Domyślnie 180."
  PINGKIT_NOTIFY_URLS:
    name: "Miejsca docelowe powiadomień"
    description: "Dokąd agent wysyła też alerty: jeden adres URL w wierszu dla ntfy, Telegram, Discord, Pushover, webhooka lub Apprise. Subskrypcja nie jest potrzebna."
  PINGKIT_SPEED_TEST:
    name: "Test prędkości"
    description: "daily uruchamia jeden test dziennie o losowej minucie oraz gdy poprosisz o to z iPhone'a; manual tylko gdy poprosisz, dla łącza z limitem danych; off nigdy nie uruchamia testu."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Limit danych testu prędkości"
    description: "Najwięcej danych, ile testy prędkości mogą zużyć w miesiącu kalendarzowym, w megabajtach. Po jego osiągnięciu żaden test się nie rozpocznie. Domyślnie 10000."
network:
  7474/tcp: "Strona stanu (HTTP)"
  7475/tcp: "Połączenie z iPhone'em (HTTPS)"
