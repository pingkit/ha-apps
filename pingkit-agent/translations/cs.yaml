  PINGKIT_ARP_INTERVAL:
    name: "Interval tabulky sousedů (sekundy)"
    description: "Sekundy mezi čteními tabulky sousedů (ARP). Výchozí 30."
  PINGKIT_PING_INTERVAL:
    name: "Interval kontroly internetu (sekundy)"
    description: "Sekundy mezi kontrolami internetu. Výchozí 60."
  PINGKIT_INTERNET_HOSTS:
