  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Sekundy do nepřítomnosti"
    description: "Jak dlouho zůstane sledované zařízení doma po poslední odpovědi, aby se spící telefon nejevil jako pryč. Výchozí 180."
  PINGKIT_NOTIFY_URLS:
    name: "Cíle oznámení"
    description: "Kam agent posílá upozornění také: jedna adresa URL na řádek pro ntfy, Telegram, Discord, Pushover, webhook nebo Apprise. Předplatné není potřeba."
  PINGKIT_SPEED_TEST:
    name: "Test rychlosti"
    description: "daily spustí jeden test denně v náhodnou minutu a také když o něj požádáte z iPhonu; manual jen když o něj požádáte, pro připojení s datovým limitem; off nespustí nikdy žádný."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Datový limit testu rychlosti"
    description: "Nejvíce dat, která smějí testy rychlosti spotřebovat za kalendářní měsíc, v megabajtech. Po jeho dosažení se žádný test nespustí. Výchozí 10000."
network:
  7474/tcp: "Stavová stránka (HTTP)"
  7475/tcp: "Připojení iPhonu (HTTPS)"
