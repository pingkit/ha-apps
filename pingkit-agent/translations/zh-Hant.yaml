# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "配對碼"
    description: "你的 iPhone 上的 PingKit 在「代理」、「新增代理」中顯示的 8 位代碼。只能使用一次，10 分鐘後過期；配對後可以清除。"
  PINGKIT_PORT:
    name: "狀態頁面連接埠"
    description: "狀態頁面的連接埠（HTTP）。預設 7474。"
  PINGKIT_API_PORT:
    name: "iPhone 連線連接埠"
    description: "你的 iPhone 連線到代理所用的 HTTPS 連接埠。預設 7475。"
  PINGKIT_BIND:
    name: "監聽位址"
    description: "狀態頁面的位址。預設 0.0.0.0。iPhone 連線一律在所有介面上監聽。"
  PINGKIT_IFACE:
    name: "網路介面"
    description: "要監控的介面，例如 end0 或 eth0。預設為預設路由所在的介面。"
  PINGKIT_SWEEP_INTERVAL:
    name: "掃描間隔（秒）"
    description: "主動掃描你的網路的間隔秒數。預設 900（15 分鐘）。"
  PINGKIT_ARP_INTERVAL:
    name: "鄰居表間隔（秒）"
    description: "讀取鄰居表（ARP）的間隔秒數。預設 30。"
  PINGKIT_PING_INTERVAL:
    name: "網際網路檢查間隔（秒）"
    description: "網際網路檢查的間隔秒數。預設 60。"
  PINGKIT_INTERNET_HOSTS:
    name: "網際網路檢查位址"
    description: "一到四個 IP 位址，以逗號分隔。預設 1.1.1.1,8.8.8.8。"
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto 在系統允許時使用 ping，否則使用 ARP 和 TCP 檢查；off 從不 ping。"
  PINGKIT_MDNS:
    name: "Bonjour（mDNS）"
    description: "auto 會監聽並讓你的 iPhone 看到代理；active 僅傳送查詢，因此你的 iPhone 看不到它；off 關閉 Bonjour。"
  PINGKIT_SSDP:
    name: "UPnP 探索（SSDP）"
    description: "監聽 UPnP 裝置。預設 on。"
  PINGKIT_STATUS_PAGE:
    name: "狀態頁面"
    description: "off 會完全關閉狀態頁面。預設 on。"
  PINGKIT_OFFLINE_ALERTS:
    name: "裝置離線提醒"
    description: "裝置離開你的網路時提醒。裝置連續三次掃描未回應後會被回報為離線，以預設間隔最長可能需要 45 分鐘。預設 off。"
  PINGKIT_OFFLINE_THRESHOLD:
    name: "判定離線前的未回應掃描次數"
    description: "預設 3。"
  PINGKIT_LEARNING_DAYS:
    name: "學習天數"
    description: "在新裝置提醒開始前，代理學習你的裝置的天數。預設 1。"
  PINGKIT_EVENTS_PER_HOUR:
    name: "每小時提醒數"
    description: "代理每小時最多傳送的提醒數。預設 60。"
  PINGKIT_WORKER_URL:
    name: "中繼位址"
    description: "僅供開發使用。請留空。"
  PINGKIT_LOG_LEVEL:
    name: "記錄層級"
    description: "預設 info。"
  PINGKIT_LOG_FORMAT:
    name: "記錄格式"
    description: "json 或 text。預設 json。"
  PINGKIT_LOCALE:
    name: "狀態頁面語言"
    description: "語言代碼，例如 de 或 pt-BR。留空則跟隨瀏覽器語言，不支援時使用英文。"
  PINGKIT_MQTT_URL:
    name: "MQTT 伺服器"
    description: "留空則使用 Home Assistant 中的 Mosquitto App。否則填寫 mqtt://host:1883 或 mqtts://host:8883，填 off 則不使用 MQTT。"
  PINGKIT_MQTT_USERNAME:
    name: "MQTT 使用者名稱"
    description: "僅用於上方指定的 MQTT 伺服器。Home Assistant 中的 Mosquitto 無需在此填寫。"
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT 密碼"
    description: "僅用於上方指定的 MQTT 伺服器。Home Assistant 中的 Mosquitto 無需在此填寫。"
  PINGKIT_MQTT_TRACKERS:
    name: "在家追蹤器"
    description: "personal 為手機、平板電腦和使用私密 Wi-Fi 位址的任何裝置建立追蹤器；all 為每台裝置建立；none 關閉追蹤器。"
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "判定離家前的秒數"
    description: "被追蹤裝置在最後一次回應後仍算在家的時間，避免休眠的手機被視為離家。預設 180。"
  PINGKIT_NOTIFY_URLS:
    name: "通知目標"
    description: "代理也會將提醒傳送到這些位置：每列一個 URL，可用於 ntfy、Telegram、Discord、Pushover、Webhook 或 Apprise。不需要訂閱。"
  PINGKIT_SPEED_TEST:
    name: "速度測試"
    description: "daily 每天在隨機時間測試一次，並在你從 iPhone 要求時測試；manual 僅在你要求時測試，適用於有流量上限的連線；off 從不測試。"
  PINGKIT_SPEED_BUDGET_MB:
    name: "速度測試流量上限"
    description: "速度測試在一個曆月內最多可使用的流量，單位為百萬位元組。達到上限後不會再開始測試。預設 10000。"
network:
  7474/tcp: "狀態頁面（HTTP）"
  7475/tcp: "iPhone 連線（HTTPS）"
