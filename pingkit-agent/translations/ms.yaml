# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Kod gandingan"
    description: "Kod 8 aksara yang ditunjukkan oleh PingKit pada iPhone anda di bawah Ejen, Tambah Ejen. Kod berfungsi sekali dan tamat tempoh selepas 10 minit; anda boleh mengosongkannya selepas penggandingan."
  PINGKIT_PORT:
    name: "Port halaman status"
    description: "Port halaman status (HTTP). Lalai 7474."
  PINGKIT_API_PORT:
    name: "Port sambungan iPhone"
    description: "Port HTTPS yang digunakan iPhone anda untuk menyambung ke ejen. Lalai 7475."
  PINGKIT_BIND:
    name: "Alamat dengar"
    description: "Alamat halaman status. Lalai 0.0.0.0. Sambungan iPhone sentiasa mendengar pada semua antara muka."
  PINGKIT_IFACE:
    name: "Antara muka rangkaian"
    description: "Antara muka yang dipantau, contohnya end0 atau eth0. Lalai ialah antara muka dengan laluan lalai."
  PINGKIT_SWEEP_INTERVAL:
    name: "Selang imbasan (saat)"
    description: "Saat antara imbasan aktif rangkaian anda. Lalai 900 (15 minit)."
  PINGKIT_ARP_INTERVAL:
    name: "Selang jadual jiran (saat)"
    description: "Saat antara bacaan jadual jiran (ARP). Lalai 30."
  PINGKIT_PING_INTERVAL:
    name: "Selang semakan internet (saat)"
    description: "Saat antara semakan internet. Lalai 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Alamat semakan internet"
    description: "Satu hingga empat alamat IP, dipisahkan dengan koma. Lalai 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto menggunakan ping jika sistem membenarkannya dan jika tidak, semakan ARP dan TCP; off tidak pernah menghantar ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto mendengar dan menjadikan ejen kelihatan kepada iPhone anda; active hanya menghantar pertanyaan, jadi iPhone anda tidak melihatnya; off mematikan Bonjour."
  PINGKIT_SSDP:
    name: "Penemuan UPnP (SSDP)"
    description: "Dengar peranti UPnP. Lalai on."
  PINGKIT_STATUS_PAGE:
    name: "Halaman status"
    description: "off mematikan halaman status sepenuhnya. Lalai on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Amaran Peranti Luar Talian"
    description: "Beri amaran apabila peranti meninggalkan rangkaian anda. Peranti dilaporkan luar talian apabila ia tidak membalas tiga imbasan berturut-turut, yang boleh mengambil masa sehingga 45 minit dengan imbasan lalai. Lalai off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Imbasan terlepas sebelum luar talian"
    description: "Lalai 3."
  PINGKIT_LEARNING_DAYS:
    name: "Hari pembelajaran"
    description: "Hari ejen mempelajari peranti anda sebelum amaran Peranti Baharu bermula. Lalai 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Amaran sejam"
    description: "Bilangan amaran terbanyak yang dihantar ejen dalam sejam. Lalai 60."
  PINGKIT_WORKER_URL:
    name: "Alamat geganti"
    description: "Untuk pembangunan sahaja. Biarkan kosong."
  PINGKIT_LOG_LEVEL:
    name: "Tahap log"
    description: "Lalai info."
  PINGKIT_LOG_FORMAT:
    name: "Format log"
    description: "json atau text. Lalai json."
  PINGKIT_LOCALE:
    name: "Bahasa halaman status"
    description: "Kod bahasa seperti de atau pt-BR. Jika kosong, bahasa pelayar digunakan, dan bahasa Inggeris hanya jika bahasa itu tidak disokong."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Biarkan kosong untuk menggunakan apl Mosquitto dalam Home Assistant. Jika tidak, mqtt://host:1883 atau mqtts://host:8883, atau off untuk tanpa MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Nama pengguna MQTT"
    description: "Hanya untuk broker yang dinyatakan di atas. Mosquitto dalam Home Assistant tidak memerlukan apa-apa di sini."
  PINGKIT_MQTT_PASSWORD:
    name: "Kata laluan MQTT"
    description: "Hanya untuk broker yang dinyatakan di atas. Mosquitto dalam Home Assistant tidak memerlukan apa-apa di sini."
  PINGKIT_MQTT_TRACKERS:
    name: "Penjejak kehadiran"
    description: "personal memberi penjejak kepada telefon, tablet dan apa-apa sahaja yang menggunakan alamat Wi-Fi peribadi; all kepada setiap peranti; none mematikannya."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Saat sebelum dianggap keluar"
    description: "Berapa lama peranti yang dijejak kekal di rumah selepas jawapan terakhirnya, supaya telefon yang tidur tidak dianggap keluar. Lalai 180."
  PINGKIT_NOTIFY_URLS:
    name: "Destinasi pemberitahuan"
    description: "Tempat ejen juga menghantar amarannya: satu URL setiap baris untuk ntfy, Telegram, Discord, Pushover, webhook atau Apprise. Tiada langganan diperlukan."
  PINGKIT_SPEED_TEST:
    name: "Ujian kelajuan"
    description: "daily menjalankan satu ujian sehari pada minit rawak, dan apabila anda memintanya daripada iPhone; manual hanya apabila anda memintanya, untuk sambungan yang mempunyai had data; off tidak pernah menjalankannya."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Had data ujian kelajuan"
    description: "Jumlah maksimum yang boleh digunakan oleh ujian kelajuan dalam satu bulan kalendar, dalam megabait. Selepas had dicapai, tiada ujian dimulakan. Lalai 10000."
network:
  7474/tcp: "Halaman status (HTTP)"
  7475/tcp: "Sambungan iPhone (HTTPS)"
