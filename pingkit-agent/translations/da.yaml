    name: "Interval for nabotabellen (sekunder)"
    description: "Sekunder mellem aflæsninger af nabotabellen (ARP). Standard 30."
  PINGKIT_PING_INTERVAL:
    name: "Interval for internettjek (sekunder)"
    description: "Sekunder mellem internettjek. Standard 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Adresser til internettjek"
    description: "En til fire IP-adresser, adskilt af kommaer. Standard 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto bruger ping, hvor systemet tillader det, og ellers ARP- og TCP-tjek; off pinger aldrig."
  PINGKIT_MDNS:
