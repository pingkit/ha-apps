    name: "Mistede scanninger før offline"
    description: "Standard 3."
  PINGKIT_LEARNING_DAYS:
    name: "Læringsdage"
    description: "Dage, hvor agenten lærer dine enheder at kende, før advarsler om Ny enhed starter. Standard 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Advarsler pr. time"
    description: "Det højeste antal advarsler, agenten sender på en time. Standard 60."
  PINGKIT_WORKER_URL:
    name: "Relæadresse"
    description: "Kun til udvikling. Lad feltet stå tomt."
  PINGKIT_LOG_LEVEL:
    name: "Logniveau"
    description: "Standard info."
  PINGKIT_LOG_FORMAT:
    name: "Logformat"
    description: "json eller text. Standard json."
  PINGKIT_LOCALE:
    name: "Statussidens sprog"
    description: "En sprogkode som de eller pt-BR. Tom: browserens sprog, ellers engelsk."
  PINGKIT_MQTT_URL:
    name: "MQTT-broker"
    description: "Lad stå tomt for at bruge Mosquitto-appen i Home Assistant. Ellers mqtt://host:1883 eller mqtts://host:8883, eller off for ingen MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "MQTT-brugernavn"
    description: "Kun til en broker, du har angivet ovenfor. Mosquitto i Home Assistant behøver intet her."
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT-adgangskode"
    description: "Kun til en broker, du har angivet ovenfor. Mosquitto i Home Assistant behøver intet her."
  PINGKIT_MQTT_TRACKERS:
    name: "Tilstedeværelsessporing"
    description: "personal giver telefoner, tablets og alt med en privat Wi-Fi-adresse sporing; all giver alle enheder det; none slår det fra."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Sekunder før væk"
    description: "Hvor længe en sporet enhed forbliver hjemme efter sit seneste svar, så en sovende telefon ikke ser ud til at være væk. Standard 180."
  PINGKIT_NOTIFY_URLS:
    name: "Notifikationsmål"
    description: "Hvor agenten også sender sine advarsler: én URL pr. række til ntfy, Telegram, Discord, Pushover, en webhook eller Apprise. Kræver intet abonnement."
  PINGKIT_SPEED_TEST:
    name: "Hastighedstest"
    description: "daily kører én test om dagen på et tilfældigt minut og når du beder om det fra iPhone; manual kører kun én, når du beder om det, til en forbindelse med datagrænse; off kører aldrig nogen."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Datagrænse for hastighedstest"
    description: "Det meste, hastighedstestene må bruge i en kalendermåned, i megabyte. Ingen test starter, når grænsen er nået. Standard 10000."
network:
  7474/tcp: "Statusside (HTTP)"
  7475/tcp: "iPhone-forbindelse (HTTPS)"
