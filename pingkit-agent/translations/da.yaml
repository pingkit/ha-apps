  PINGKIT_PORT:
    name: "Statussidens port"
    description: "Statussidens port (HTTP). Standard 7474."
  PINGKIT_API_PORT:
    name: "Port til iPhone-forbindelsen"
    description: "HTTPS-porten, som din iPhone forbinder til agenten på. Standard 7475."
  PINGKIT_BIND:
