    name: "Statusside"
    description: "off slår statussiden helt fra. Standard on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Advarsler om Enhed offline"
    description: "Advar, når en enhed forlader dit netværk. En enhed meldes offline efter tre mistede scanninger, hvilket kan tage op til 45 minutter med standardintervallet. Standard off."
