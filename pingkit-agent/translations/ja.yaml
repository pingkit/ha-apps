# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "ペアリングコード"
    description: "iPhoneのPingKitで「エージェント」、「エージェントを追加」に表示される8文字のコードです。1回だけ使え、10分で期限切れになります。ペアリング後は消去してもかまいません。"
  PINGKIT_PORT:
    name: "ステータスページのポート"
    description: "ステータスページ（HTTP）のポートです。デフォルトは7474。"
  PINGKIT_API_PORT:
    name: "iPhone接続用ポート"
    description: "iPhoneがエージェントに接続するHTTPSポートです。デフォルトは7475。"
  PINGKIT_BIND:
    name: "待ち受けアドレス"
    description: "ステータスページのアドレスです。デフォルトは0.0.0.0。iPhoneとの接続は常にすべてのインターフェースで待ち受けます。"
  PINGKIT_IFACE:
    name: "ネットワークインターフェース"
    description: "監視するインターフェースです（例：end0、eth0）。デフォルトはデフォルトルートのインターフェース。"
  PINGKIT_SWEEP_INTERVAL:
    name: "スキャン間隔（秒）"
    description: "ネットワークをアクティブにスキャンする間隔（秒）です。デフォルトは900（15分）。"
  PINGKIT_ARP_INTERVAL:
    name: "近隣テーブルの読み取り間隔（秒）"
    description: "近隣テーブル（ARP）を読み取る間隔（秒）です。デフォルトは30。"
  PINGKIT_PING_INTERVAL:
    name: "インターネット確認の間隔（秒）"
    description: "インターネットを確認する間隔（秒）です。デフォルトは60。"
  PINGKIT_INTERNET_HOSTS:
    name: "インターネット確認用アドレス"
    description: "1〜4個のIPアドレスをカンマ区切りで指定します。デフォルトは1.1.1.1,8.8.8.8。"
  PINGKIT_ICMP:
    name: "Ping"
    description: "autoはシステムが許可する場合にpingを使い、それ以外はARPとTCPで確認します。offはpingを使いません。"
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "autoは待ち受けを行い、iPhoneからエージェントを検出できるようにします。activeは問い合わせを送るだけなので、iPhoneからは検出できません。offはBonjourを無効にします。"
  PINGKIT_SSDP:
    name: "UPnP検出（SSDP）"
    description: "UPnPデバイスからの通知を待ち受けます。デフォルトはon。"
  PINGKIT_STATUS_PAGE:
    name: "ステータスページ"
    description: "offにするとステータスページを完全に無効にします。デフォルトはon。"
  PINGKIT_OFFLINE_ALERTS:
    name: "「デバイスオフライン」アラート"
    description: "デバイスがネットワークから離れたときに通知します。デバイスはスキャンに3回続けて応答しないとオフラインと報告され、デフォルトの間隔では最大45分かかります。デフォルトはoff。"
  PINGKIT_OFFLINE_THRESHOLD:
    name: "オフラインと判定するまでのスキャン回数"
    description: "デフォルトは3。"
  PINGKIT_LEARNING_DAYS:
    name: "学習日数"
    description: "「新規デバイス」アラートを始める前に、エージェントがデバイスを学習する日数です。デフォルトは1。"
  PINGKIT_EVENTS_PER_HOUR:
    name: "1時間あたりのアラート数"
    description: "エージェントが1時間に送るアラートの上限です。デフォルトは60。"
  PINGKIT_WORKER_URL:
    name: "中継アドレス"
    description: "開発専用です。空欄のままにしてください。"
  PINGKIT_LOG_LEVEL:
    name: "ログレベル"
    description: "デフォルトはinfo。"
  PINGKIT_LOG_FORMAT:
    name: "ログ形式"
    description: "jsonまたはtext。デフォルトはjson。"
  PINGKIT_LOCALE:
    name: "ステータスページの言語"
    description: "deやpt-BRなどの言語コードです。空欄の場合はブラウザの言語、対応していなければ英語になります。"
  PINGKIT_MQTT_URL:
    name: "MQTTブローカー"
    description: "空欄にするとHome AssistantのMosquittoアプリを使います。それ以外はmqtt://host:1883またはmqtts://host:8883、MQTTを使わない場合はoffです。"
  PINGKIT_MQTT_USERNAME:
    name: "MQTTユーザー名"
    description: "上で指定したブローカーのみ。Home AssistantのMosquittoでは入力不要です。"
  PINGKIT_MQTT_PASSWORD:
    name: "MQTTパスワード"
    description: "上で指定したブローカーのみ。Home AssistantのMosquittoでは入力不要です。"
  PINGKIT_MQTT_TRACKERS:
    name: "在宅トラッカー"
    description: "personalはスマートフォン、タブレット、プライベートWi-Fiアドレスを使うデバイスに、allはすべてのデバイスにトラッカーを付けます。noneはオフにします。"
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "不在と判断するまでの秒数"
    description: "最後の応答の後、追跡中のデバイスを在宅のままにする時間です。スリープ中のスマートフォンが不在と見なされないようにします。デフォルトは180。"
  PINGKIT_NOTIFY_URLS:
    name: "通知先"
    description: "エージェントがアラートを送信する追加の送信先です。ntfy、Telegram、Discord、Pushover、Webhook、AppriseのURLを1行に1つずつ指定します。サブスクリプションは不要です。"
  PINGKIT_SPEED_TEST:
    name: "速度テスト"
    description: "daily は 1 日 1 回ランダムな時刻にテストし、iPhone から依頼したときにも実行します。manual は依頼したときだけ実行します（データ上限のある回線向け）。off は実行しません。"
  PINGKIT_SPEED_BUDGET_MB:
    name: "速度テストのデータ上限"
    description: "速度テストが 1 か月（暦月）に使える最大量（メガバイト）。上限に達するとテストは開始されません。デフォルトは 10000。"
network:
  7474/tcp: "ステータスページ（HTTP）"
  7475/tcp: "iPhone接続（HTTPS）"
