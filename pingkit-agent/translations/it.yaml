# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Codice di associazione"
    description: "Il codice di 8 caratteri che PingKit mostra sul tuo iPhone in Agent, Aggiungi un agent. Vale una volta e scade dopo 10 minuti; dopo l'associazione puoi cancellarlo."
  PINGKIT_PORT:
    name: "Porta della pagina di stato"
    description: "La porta della pagina di stato (HTTP). Predefinita 7474."
  PINGKIT_API_PORT:
    name: "Porta di connessione dell'iPhone"
    description: "La porta HTTPS su cui il tuo iPhone si collega all'agent. Predefinita 7475."
  PINGKIT_BIND:
    name: "Indirizzo di ascolto"
    description: "L'indirizzo della pagina di stato. Predefinito 0.0.0.0. La connessione dell'iPhone è sempre in ascolto su tutte le interfacce."
  PINGKIT_IFACE:
    name: "Interfaccia di rete"
    description: "L'interfaccia da osservare, per esempio end0 o eth0. Predefinita: quella della route predefinita."
  PINGKIT_SWEEP_INTERVAL:
    name: "Intervallo di scansione (secondi)"
    description: "Secondi tra le scansioni attive della tua rete. Predefinito 900 (15 minuti)."
  PINGKIT_ARP_INTERVAL:
    name: "Intervallo della tabella dei vicini (secondi)"
    description: "Secondi tra le letture della tabella dei vicini (ARP). Predefinito 30."
  PINGKIT_PING_INTERVAL:
    name: "Intervallo del controllo Internet (secondi)"
    description: "Secondi tra i controlli di Internet. Predefinito 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Indirizzi del controllo Internet"
    description: "Da uno a quattro indirizzi IP, separati da virgole. Predefiniti 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto usa il ping dove il sistema lo consente e altrimenti controlli ARP e TCP; off non invia mai ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto ascolta e rende l'agent visibile al tuo iPhone; active invia solo richieste, quindi il tuo iPhone non lo vede; off disattiva Bonjour."
  PINGKIT_SSDP:
    name: "Rilevamento UPnP (SSDP)"
    description: "Ascolta i dispositivi UPnP. Predefinito on."
  PINGKIT_STATUS_PAGE:
    name: "Pagina di stato"
    description: "off disattiva del tutto la pagina di stato. Predefinito on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Avvisi Dispositivo offline"
    description: "Avvisa quando un dispositivo lascia la tua rete. Un dispositivo risulta offline dopo tre scansioni mancate, il che può richiedere fino a 45 minuti con la scansione predefinita. Predefinito off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Scansioni mancate prima di offline"
    description: "Predefinito 3."
  PINGKIT_LEARNING_DAYS:
    name: "Giorni di apprendimento"
    description: "Giorni in cui l'agent impara i tuoi dispositivi prima che inizino gli avvisi Nuovo dispositivo. Predefinito 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Avvisi all'ora"
    description: "Il numero massimo di avvisi che l'agent invia in un'ora. Predefinito 60."
  PINGKIT_WORKER_URL:
    name: "Indirizzo del relay"
    description: "Solo per lo sviluppo. Lascia vuoto."
  PINGKIT_LOG_LEVEL:
    name: "Livello di log"
    description: "Predefinito info."
  PINGKIT_LOG_FORMAT:
    name: "Formato del log"
    description: "json o text. Predefinito json."
  PINGKIT_LOCALE:
    name: "Lingua della pagina di stato"
    description: "Un codice di lingua come de o pt-BR. Vuoto: la lingua del browser, altrimenti l'inglese."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Lascia vuoto per usare l'app Mosquitto di Home Assistant. Altrimenti mqtt://host:1883 o mqtts://host:8883, oppure off per non usare MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Nome utente MQTT"
    description: "Solo per un broker indicato sopra. Mosquitto in Home Assistant non richiede nulla qui."
  PINGKIT_MQTT_PASSWORD:
    name: "Password MQTT"
    description: "Solo per un broker indicato sopra. Mosquitto in Home Assistant non richiede nulla qui."
  PINGKIT_MQTT_TRACKERS:
    name: "Tracker di presenza"
    description: "personal assegna un tracker a telefoni, tablet e a tutto ciò che usa un indirizzo Wi-Fi privato; all a ogni dispositivo; none li disattiva."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Secondi prima di assente"
    description: "Per quanto un dispositivo tracciato resta a casa dopo l'ultima risposta, così un telefono in stop non risulta assente. Predefinito 180."
  PINGKIT_NOTIFY_URLS:
    name: "Destinazioni delle notifiche"
    description: "Dove l'agent invia anche i suoi avvisi: un URL per riga per ntfy, Telegram, Discord, Pushover, un webhook o Apprise. Non serve alcun abbonamento."
  PINGKIT_SPEED_TEST:
    name: "Test di velocità"
    description: "daily esegue un test al giorno a un minuto casuale e quando lo chiedi dall'iPhone; manual solo quando lo chiedi, per una connessione con limite di dati; off non ne esegue mai."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Limite dati del test di velocità"
    description: "Il massimo che i test di velocità possono usare in un mese solare, in megabyte. Una volta raggiunto, nessun test parte. Predefinito 10000."
network:
  7474/tcp: "Pagina di stato (HTTP)"
  7475/tcp: "Connessione dell'iPhone (HTTPS)"
