# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Kopplungscode"
    description: "Der 8-stellige Code, den PingKit auf Ihrem iPhone unter Agents, Agent hinzufügen anzeigt. Er gilt nur einmal und läuft nach 10 Minuten ab; nach dem Koppeln können Sie ihn löschen."
  PINGKIT_PORT:
    name: "Port der Statusseite"
    description: "Der Port der Statusseite (HTTP). Standard: 7474."
  PINGKIT_API_PORT:
    name: "Port der iPhone-Verbindung"
    description: "Der HTTPS-Port, über den sich Ihr iPhone mit dem Agenten verbindet. Standard: 7475."
  PINGKIT_BIND:
    name: "Listen-Adresse"
    description: "Die Adresse der Statusseite. Standard: 0.0.0.0. Die iPhone-Verbindung ist immer auf allen Schnittstellen erreichbar."
  PINGKIT_IFACE:
    name: "Netzwerkschnittstelle"
    description: "Die zu überwachende Schnittstelle, zum Beispiel end0 oder eth0. Standard: die mit der Standardroute."
  PINGKIT_SWEEP_INTERVAL:
    name: "Scan-Intervall (Sekunden)"
    description: "Sekunden zwischen aktiven Scans Ihres Netzwerks. Standard: 900 (15 Minuten)."
  PINGKIT_ARP_INTERVAL:
    name: "Intervall der Nachbartabelle (Sekunden)"
    description: "Sekunden zwischen Abfragen der Nachbartabelle (ARP). Standard: 30."
  PINGKIT_PING_INTERVAL:
    name: "Intervall der Internetprüfung (Sekunden)"
    description: "Sekunden zwischen Internetprüfungen. Standard: 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Adressen der Internetprüfung"
    description: "Eine bis vier IP-Adressen, durch Kommas getrennt. Standard: 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto verwendet Ping, wo das System es erlaubt, und sonst ARP- und TCP-Prüfungen; off sendet nie Ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto hört zu und macht den Agenten für Ihr iPhone sichtbar; active sendet nur Anfragen, sodass Ihr iPhone ihn nicht sieht; off schaltet Bonjour aus."
  PINGKIT_SSDP:
    name: "UPnP-Erkennung (SSDP)"
    description: "Auf Ankündigungen von UPnP-Geräten hören. Standard: on."
  PINGKIT_STATUS_PAGE:
    name: "Statusseite"
    description: "off schaltet die Statusseite ganz aus. Standard: on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Meldungen „Gerät offline“"
    description: "Melden, wenn ein Gerät Ihr Netzwerk verlässt. Ein Gerät gilt nach drei verpassten Scans als offline, beim Standardintervall kann das bis zu 45 Minuten dauern. Standard: off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Verpasste Scans bis offline"
    description: "Standard: 3."
  PINGKIT_LEARNING_DAYS:
    name: "Lerntage"
    description: "Tage, in denen der Agent Ihre Geräte kennenlernt, bevor die Meldungen „Neues Gerät“ beginnen. Standard: 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Meldungen pro Stunde"
    description: "Höchstzahl der Meldungen, die der Agent in einer Stunde sendet. Standard: 60."
  PINGKIT_WORKER_URL:
    name: "Relay-Adresse"
    description: "Nur für die Entwicklung. Leer lassen."
  PINGKIT_LOG_LEVEL:
    name: "Protokollstufe"
    description: "Standard: info."
  PINGKIT_LOG_FORMAT:
    name: "Protokollformat"
    description: "json oder text. Standard: json."
  PINGKIT_LOCALE:
    name: "Sprache der Statusseite"
    description: "Ein Sprachcode wie de oder pt-BR. Leer: die Sprache des Browsers, sonst Englisch."
  PINGKIT_MQTT_URL:
    name: "MQTT-Broker"
    description: "Leer lassen, um die Mosquitto-App in Home Assistant zu verwenden. Sonst mqtt://host:1883 oder mqtts://host:8883, oder off für kein MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "MQTT-Benutzername"
    description: "Nur für einen oben angegebenen Broker. Mosquitto in Home Assistant braucht hier nichts."
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT-Passwort"
    description: "Nur für einen oben angegebenen Broker. Mosquitto in Home Assistant braucht hier nichts."
  PINGKIT_MQTT_TRACKERS:
    name: "Anwesenheits-Tracker"
    description: "personal gibt Telefonen, Tablets und allem mit privater WLAN-Adresse einen Tracker; all jedem Gerät; none schaltet sie aus."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Sekunden bis abwesend"
    description: "Wie lange ein verfolgtes Gerät nach seiner letzten Antwort als zu Hause gilt, damit ein schlafendes Telefon nicht als abwesend erscheint. Standard: 180."
  PINGKIT_NOTIFY_URLS:
    name: "Benachrichtigungsziele"
    description: "Wohin der Agent seine Meldungen zusätzlich sendet: eine URL pro Zeile für ntfy, Telegram, Discord, Pushover, einen Webhook oder Apprise. Kein Abo erforderlich."
  PINGKIT_SPEED_TEST:
    name: "Geschwindigkeitstest"
    description: "daily führt einen Test pro Tag zu einer zufälligen Minute aus und wenn Sie ihn auf dem iPhone anfordern; manual nur, wenn Sie ihn anfordern, für einen Anschluss mit Datenlimit; off führt nie einen aus."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Datenbudget für Geschwindigkeitstests"
    description: "Wie viel die Geschwindigkeitstests in einem Kalendermonat höchstens verbrauchen dürfen, in Megabyte. Danach startet kein Test mehr. Standard 10000."
network:
  7474/tcp: "Statusseite (HTTP)"
  7475/tcp: "iPhone-Verbindung (HTTPS)"
