    name: "Aviseringsmål"
    description: "Vart agenten också skickar sina aviseringar: en URL per rad för ntfy, Telegram, Discord, Pushover, en webhook eller Apprise. Ingen prenumeration behövs."
  PINGKIT_SPEED_TEST:
    name: "Hastighetstest"
    description: "daily kör ett test om dagen på en slumpmässig minut och när du ber om det från iPhone; manual bara när du ber om det, för en anslutning med datatak; off kör aldrig något."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Datagräns för hastighetstest"
    description: "Det mesta hastighetstesterna får använda under en kalendermånad, i megabyte. Inget test startar när gränsen är nådd. Standard 10000."
network:
  7474/tcp: "Statussida (HTTP)"
  7475/tcp: "iPhone-anslutning (HTTPS)"
