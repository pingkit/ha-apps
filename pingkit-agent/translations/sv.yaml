    name: "Loggformat"
    description: "json eller text. Standard json."
  PINGKIT_LOCALE:
    name: "Statussidans språk"
    description: "En språkkod som de eller pt-BR. Tomt: webbläsarens språk, annars engelska."
  PINGKIT_MQTT_URL:
    name: "MQTT-mäklare"
    description: "Lämna tomt för att använda Mosquitto-appen i Home Assistant. Annars mqtt://host:1883 eller mqtts://host:8883, eller off för ingen MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "MQTT-användarnamn"
    description: "Bara för en mäklare du har angett ovan. Mosquitto i Home Assistant behöver inget här."
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT-lösenord"
    description: "Bara för en mäklare du har angett ovan. Mosquitto i Home Assistant behöver inget här."
  PINGKIT_MQTT_TRACKERS:
    name: "Närvarospårning"
    description: "personal ger telefoner, surfplattor och allt med en privat Wi-Fi-adress spårning; all ger det alla enheter; none stänger av det."
  PINGKIT_MQTT_CONSIDER_HOME:
