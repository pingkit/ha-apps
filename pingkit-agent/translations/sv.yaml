    name: "Ping"
    description: "auto använder ping där systemet tillåter det och annars ARP- och TCP-kontroller; off pingar aldrig."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto lyssnar och gör agenten synlig för din iPhone; active skickar bara frågor, så din iPhone ser den inte; off stänger av Bonjour."
