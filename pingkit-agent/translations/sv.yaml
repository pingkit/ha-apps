  PINGKIT_OFFLINE_THRESHOLD:
    name: "Missade skanningar före offline"
    description: "Standard 3."
  PINGKIT_LEARNING_DAYS:
    name: "Inlärningsdagar"
    description: "Dagar då agenten lär sig dina enheter innan aviseringar om Ny enhet börjar. Standard 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Aviseringar per timme"
    description: "Det högsta antalet aviseringar som agenten skickar på en timme. Standard 60."
  PINGKIT_WORKER_URL:
    name: "Reläadress"
    description: "Endast för utveckling. Lämna tomt."
  PINGKIT_LOG_LEVEL:
    name: "Loggnivå"
    description: "Standard info."
