# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Código de emparejamiento"
    description: "El código de 8 caracteres que PingKit muestra en tu iPhone en Agentes, Añadir un agente. Sirve una sola vez y caduca a los 10 minutos; puedes borrarlo después de emparejar."
  PINGKIT_PORT:
    name: "Puerto de la página de estado"
    description: "El puerto de la página de estado (HTTP). Por defecto: 7474."
  PINGKIT_API_PORT:
    name: "Puerto de conexión del iPhone"
    description: "El puerto HTTPS por el que tu iPhone se conecta al agente. Por defecto: 7475."
  PINGKIT_BIND:
    name: "Dirección de escucha"
    description: "La dirección de la página de estado. Por defecto: 0.0.0.0. La conexión del iPhone siempre escucha en todas las interfaces."
  PINGKIT_IFACE:
    name: "Interfaz de red"
    description: "La interfaz que se vigila, por ejemplo end0 o eth0. Por defecto: la de la ruta predeterminada."
  PINGKIT_SWEEP_INTERVAL:
    name: "Intervalo de escaneo (segundos)"
    description: "Segundos entre escaneos activos de tu red. Por defecto: 900 (15 minutos)."
  PINGKIT_ARP_INTERVAL:
    name: "Intervalo de la tabla de vecinos (segundos)"
    description: "Segundos entre lecturas de la tabla de vecinos (ARP). Por defecto: 30."
  PINGKIT_PING_INTERVAL:
    name: "Intervalo de comprobación de Internet (segundos)"
    description: "Segundos entre comprobaciones de Internet. Por defecto: 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Direcciones de comprobación de Internet"
    description: "De una a cuatro direcciones IP, separadas por comas. Por defecto: 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto usa ping donde el sistema lo permite y, si no, comprobaciones ARP y TCP; off nunca hace ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto escucha y hace visible el agente para tu iPhone; active solo envía consultas, así que tu iPhone no lo ve; off desactiva Bonjour."
  PINGKIT_SSDP:
    name: "Detección UPnP (SSDP)"
    description: "Escuchar los anuncios de dispositivos UPnP. Por defecto: on."
  PINGKIT_STATUS_PAGE:
    name: "Página de estado"
    description: "off desactiva por completo la página de estado. Por defecto: on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Alertas «Dispositivo desconectado»"
    description: "Avisar cuando un dispositivo sale de tu red. Un dispositivo se marca como desconectado cuando no responde a tres escaneos seguidos, lo que puede tardar hasta 45 minutos con el intervalo por defecto. Por defecto: off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Escaneos sin respuesta antes de desconectado"
    description: "Por defecto: 3."
  PINGKIT_LEARNING_DAYS:
    name: "Días de aprendizaje"
    description: "Días en que el agente aprende tus dispositivos antes de que empiecen las alertas «Nuevo dispositivo». Por defecto: 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Alertas por hora"
    description: "El máximo de alertas que el agente envía en una hora. Por defecto: 60."
  PINGKIT_WORKER_URL:
    name: "Dirección del relé"
    description: "Solo para desarrollo. Déjalo vacío."
  PINGKIT_LOG_LEVEL:
    name: "Nivel de registro"
    description: "Por defecto: info."
  PINGKIT_LOG_FORMAT:
    name: "Formato del registro"
    description: "json o text. Por defecto: json."
  PINGKIT_LOCALE:
    name: "Idioma de la página de estado"
    description: "Un código de idioma como de o pt-BR. Vacío: el idioma del navegador y, si no, inglés."
  PINGKIT_MQTT_URL:
    name: "Bróker MQTT"
    description: "Déjalo vacío para usar la app Mosquitto de Home Assistant. Si no, mqtt://host:1883 o mqtts://host:8883, u off para no usar MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Usuario de MQTT"
    description: "Solo para un bróker indicado arriba. Mosquitto en Home Assistant no necesita nada aquí."
  PINGKIT_MQTT_PASSWORD:
    name: "Contraseña de MQTT"
    description: "Solo para un bróker indicado arriba. Mosquitto en Home Assistant no necesita nada aquí."
  PINGKIT_MQTT_TRACKERS:
    name: "Rastreadores de presencia"
    description: "personal da un rastreador a teléfonos, tabletas y cualquier dispositivo con dirección Wi-Fi privada; all a todos los dispositivos; none los desactiva."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Segundos antes de marcar ausente"
    description: "Cuánto sigue en casa un dispositivo rastreado tras su última respuesta, para que un teléfono en reposo no parezca ausente. Por defecto: 180."
  PINGKIT_NOTIFY_URLS:
    name: "Destinos de notificaciones"
    description: "Adónde envía también el agente sus alertas: una URL por fila para ntfy, Telegram, Discord, Pushover, un webhook o Apprise. No necesitas suscripción."
  PINGKIT_SPEED_TEST:
    name: "Test de velocidad"
    description: "daily hace un test al día en un minuto al azar y cuando lo pides desde el iPhone; manual solo cuando lo pides, para una conexión con límite de datos; off nunca hace ninguno."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Límite de datos del test de velocidad"
    description: "Lo máximo que pueden usar los tests de velocidad en un mes natural, en megabytes. Al alcanzarlo no empieza ningún test. Predeterminado: 10000."
network:
  7474/tcp: "Página de estado (HTTP)"
  7475/tcp: "Conexión del iPhone (HTTPS)"
