configuration:
  PINGKIT_CLAIM_CODE:
    name: "Párovací kód"
    description: "Osemmiestny kód, ktorý PingKit vo vašom iPhone zobrazí v časti Agenti, Pridať agenta. Funguje raz a vyprší po 10 minútach; po spárovaní ho môžete vymazať."
  PINGKIT_PORT:
    name: "Port stavovej stránky"
    description: "Port stavovej stránky (HTTP). Predvolené 7474."
  PINGKIT_API_PORT:
    name: "Port pripojenia iPhonu"
    description: "Port HTTPS, cez ktorý sa váš iPhone pripája k agentovi. Predvolené 7475."
  PINGKIT_BIND:
    name: "Adresa počúvania"
    description: "Adresa stavovej stránky. Predvolené 0.0.0.0. Pripojenie pre iPhone vždy počúva na všetkých rozhraniach."
  PINGKIT_IFACE:
    name: "Sieťové rozhranie"
    description: "Sledované rozhranie, napríklad end0 alebo eth0. Predvolené je rozhranie s predvolenou trasou."
  PINGKIT_SWEEP_INTERVAL:
    name: "Interval skenovania (sekundy)"
    description: "Sekundy medzi aktívnymi skenovaniami vašej siete. Predvolené 900 (15 minút)."
  PINGKIT_ARP_INTERVAL:
    name: "Interval tabuľky susedov (sekundy)"
    description: "Sekundy medzi čítaniami tabuľky susedov (ARP). Predvolené 30."
  PINGKIT_PING_INTERVAL:
    name: "Interval kontroly internetu (sekundy)"
    description: "Sekundy medzi kontrolami internetu. Predvolené 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Adresy na kontrolu internetu"
    description: "Jedna až štyri IP adresy oddelené čiarkami. Predvolené 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto používa ping tam, kde to systém dovolí, inak kontroly ARP a TCP; off nikdy nepinguje."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto počúva a zviditeľní agenta pre váš iPhone; active len odosiela dotazy, takže ho váš iPhone nevidí; off vypne Bonjour."
  PINGKIT_SSDP:
    name: "Vyhľadávanie UPnP (SSDP)"
    description: "Počúvať zariadenia UPnP. Predvolené on."
  PINGKIT_STATUS_PAGE:
    name: "Stavová stránka"
    description: "off stavovú stránku úplne vypne. Predvolené on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Upozornenia Zariadenie offline"
    description: "Upozorniť, keď zariadenie opustí vašu sieť. Zariadenie sa ohlási ako offline po troch zmeškaných skenovaniach, čo pri predvolenom intervale môže trvať až 45 minút. Predvolené off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Zmeškané skenovania do offline"
    description: "Predvolené 3."
  PINGKIT_LEARNING_DAYS:
    name: "Dni učenia"
    description: "Dni, keď sa agent učí vaše zariadenia, kým sa začnú upozornenia Nové zariadenie. Predvolené 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Upozornenia za hodinu"
    description: "Najvyšší počet upozornení, ktorý agent odošle za hodinu. Predvolené 60."
  PINGKIT_WORKER_URL:
    name: "Adresa sprostredkovacieho servera"
    description: "Len na vývoj. Nechajte prázdne."
  PINGKIT_LOG_LEVEL:
    name: "Úroveň protokolu"
    description: "Predvolené info."
  PINGKIT_LOG_FORMAT:
    name: "Formát protokolu"
    description: "json alebo text. Predvolené json."
  PINGKIT_LOCALE:
    name: "Jazyk stavovej stránky"
    description: "Kód jazyka, napríklad de alebo pt-BR. Ak je prázdne, použije sa jazyk prehliadača a angličtina len vtedy, keď tento jazyk nie je podporovaný."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Nechajte prázdne pre aplikáciu Mosquitto v Home Assistante. Inak mqtt://host:1883 alebo mqtts://host:8883, prípadne off na vypnutie MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Používateľské meno MQTT"
    description: "Len pre broker uvedený vyššie. Mosquitto v Home Assistante tu nič nepotrebuje."
  PINGKIT_MQTT_PASSWORD:
    name: "Heslo MQTT"
    description: "Len pre broker uvedený vyššie. Mosquitto v Home Assistante tu nič nepotrebuje."
  PINGKIT_MQTT_TRACKERS:
    name: "Sledovanie prítomnosti"
    description: "personal dáva sledovanie telefónom, tabletom a všetkému so súkromnou adresou Wi-Fi; all všetkým zariadeniam; none ho vypne."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Sekundy do neprítomnosti"
    description: "Ako dlho zostane sledované zariadenie doma po poslednej odpovedi, aby sa spiaci telefón nejavil ako preč. Predvolené 180."
  PINGKIT_NOTIFY_URLS:
    name: "Ciele hlásení"
    description: "Kam agent posiela upozornenia aj: jedna adresa URL na riadok pre ntfy, Telegram, Discord, Pushover, webhook alebo Apprise. Predplatné nie je potrebné."
  PINGKIT_SPEED_TEST:
    name: "Test rýchlosti"
    description: "daily spustí jeden test denne v náhodnú minútu a aj keď oň požiadate z iPhonu; manual len keď oň požiadate, pre pripojenie s dátovým limitom; off nespustí nikdy žiadny."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Dátový limit testu rýchlosti"
    description: "Najviac dát, ktoré smú testy rýchlosti minúť za kalendárny mesiac, v megabajtoch. Po jeho dosiahnutí sa žiadny test nespustí. Predvolené 10000."
network:
  7474/tcp: "Stavová stránka (HTTP)"
  7475/tcp: "Pripojenie iPhonu (HTTPS)"
