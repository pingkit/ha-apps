# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Код привязки"
    description: "Код из 8 символов, который PingKit на вашем iPhone показывает в разделе «Агенты», «Добавить агента». Он срабатывает один раз и действует 10 минут; после привязки его можно стереть."
  PINGKIT_PORT:
    name: "Порт страницы статуса"
    description: "Порт страницы статуса (HTTP). По умолчанию 7474."
  PINGKIT_API_PORT:
    name: "Порт подключения iPhone"
    description: "Порт HTTPS, через который ваш iPhone подключается к агенту. По умолчанию 7475."
  PINGKIT_BIND:
    name: "Адрес прослушивания"
    description: "Адрес страницы статуса. По умолчанию 0.0.0.0. Подключение для iPhone всегда принимается на всех интерфейсах."
  PINGKIT_IFACE:
    name: "Сетевой интерфейс"
    description: "Отслеживаемый интерфейс, например end0 или eth0. По умолчанию: интерфейс маршрута по умолчанию."
  PINGKIT_SWEEP_INTERVAL:
    name: "Интервал сканирования (секунды)"
    description: "Секунды между активными сканированиями вашей сети. По умолчанию 900 (15 минут)."
  PINGKIT_ARP_INTERVAL:
    name: "Интервал таблицы соседей (секунды)"
    description: "Секунды между чтениями таблицы соседей (ARP). По умолчанию 30."
  PINGKIT_PING_INTERVAL:
    name: "Интервал проверки интернета (секунды)"
    description: "Секунды между проверками интернета. По умолчанию 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Адреса для проверки интернета"
    description: "От одного до четырёх IP-адресов через запятую. По умолчанию 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto использует ping, где система это позволяет, а иначе проверки ARP и TCP; off никогда не пингует."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto слушает и делает агента видимым для вашего iPhone; active только отправляет запросы, поэтому ваш iPhone его не видит; off отключает Bonjour."
  PINGKIT_SSDP:
    name: "Обнаружение UPnP (SSDP)"
    description: "Слушать устройства UPnP. По умолчанию on."
  PINGKIT_STATUS_PAGE:
    name: "Страница статуса"
    description: "off полностью отключает страницу статуса. По умолчанию on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Оповещения «Устройство не в сети»"
    description: "Оповещать, когда устройство покидает вашу сеть. Устройство считается не в сети после трёх пропущенных сканирований, при стандартном интервале это до 45 минут. По умолчанию off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Пропущенных сканирований до статуса «не в сети»"
    description: "По умолчанию 3."
  PINGKIT_LEARNING_DAYS:
    name: "Дни обучения"
    description: "Сколько дней агент изучает ваши устройства, прежде чем начнутся оповещения «Новое устройство». По умолчанию 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Оповещений в час"
    description: "Максимум оповещений, которые агент отправляет за час. По умолчанию 60."
  PINGKIT_WORKER_URL:
    name: "Адрес ретранслятора"
    description: "Только для разработки. Оставьте пустым."
  PINGKIT_LOG_LEVEL:
    name: "Уровень журнала"
    description: "По умолчанию info."
  PINGKIT_LOG_FORMAT:
    name: "Формат журнала"
    description: "json или text. По умолчанию json."
  PINGKIT_LOCALE:
    name: "Язык страницы статуса"
    description: "Код языка, например de или pt-BR. Если пусто, используется язык браузера, а если он не поддерживается, английский."
  PINGKIT_MQTT_URL:
    name: "Брокер MQTT"
    description: "Оставьте пустым, чтобы использовать приложение Mosquitto в Home Assistant. Иначе mqtt://host:1883 или mqtts://host:8883, либо off, чтобы отключить MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Имя пользователя MQTT"
    description: "Только для брокера, указанного выше. Mosquitto в Home Assistant здесь ничего не требуется."
  PINGKIT_MQTT_PASSWORD:
    name: "Пароль MQTT"
    description: "Только для брокера, указанного выше. Mosquitto в Home Assistant здесь ничего не требуется."
  PINGKIT_MQTT_TRACKERS:
    name: "Отслеживание присутствия"
    description: "personal включает отслеживание для телефонов, планшетов и всего, что использует частный адрес Wi-Fi; all для всех устройств; none отключает его."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Секунд до статуса «Не дома»"
    description: "Сколько отслеживаемое устройство считается дома после последнего ответа, чтобы спящий телефон не выглядел отсутствующим. По умолчанию 180."
  PINGKIT_NOTIFY_URLS:
    name: "Каналы уведомлений"
    description: "Куда агент также отправляет оповещения: один URL в строке для ntfy, Telegram, Discord, Pushover, вебхука или Apprise. Подписка не нужна."
  PINGKIT_SPEED_TEST:
    name: "Тест скорости"
    description: "daily запускает один тест в день в случайную минуту, а также когда вы запрашиваете его с iPhone; manual только по вашему запросу, для подключения с лимитом трафика; off не запускает никогда."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Лимит трафика для теста скорости"
    description: "Наибольший объём, который тесты скорости могут использовать за календарный месяц, в мегабайтах. После его исчерпания тесты не запускаются. По умолчанию 10000."
network:
  7474/tcp: "Страница статуса (HTTP)"
  7475/tcp: "Подключение iPhone (HTTPS)"
