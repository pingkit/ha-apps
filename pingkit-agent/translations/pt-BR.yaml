# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Código de emparelhamento"
    description: "O código de 8 caracteres que o PingKit mostra no seu iPhone em Agentes, Adicionar agente. Vale uma vez e expira em 10 minutos; depois de emparelhar, você pode apagá-lo."
  PINGKIT_PORT:
    name: "Porta da página de status"
    description: "A porta da página de status (HTTP). Padrão 7474."
  PINGKIT_API_PORT:
    name: "Porta de conexão do iPhone"
    description: "A porta HTTPS pela qual seu iPhone se conecta ao agente. Padrão 7475."
  PINGKIT_BIND:
    name: "Endereço de escuta"
    description: "O endereço da página de status. Padrão 0.0.0.0. A conexão do iPhone sempre escuta em todas as interfaces."
  PINGKIT_IFACE:
    name: "Interface de rede"
    description: "A interface observada, por exemplo end0 ou eth0. Padrão: a da rota padrão."
  PINGKIT_SWEEP_INTERVAL:
    name: "Intervalo de varredura (segundos)"
    description: "Segundos entre varreduras ativas da sua rede. Padrão 900 (15 minutos)."
  PINGKIT_ARP_INTERVAL:
    name: "Intervalo da tabela de vizinhos (segundos)"
    description: "Segundos entre leituras da tabela de vizinhos (ARP). Padrão 30."
  PINGKIT_PING_INTERVAL:
    name: "Intervalo de verificação da Internet (segundos)"
    description: "Segundos entre verificações da Internet. Padrão 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Endereços de verificação da Internet"
    description: "De um a quatro endereços IP, separados por vírgulas. Padrão 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto usa ping onde o sistema permite e, se não, verificações ARP e TCP; off nunca faz ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto escuta e torna o agente visível para seu iPhone; active só envia consultas, então seu iPhone não o vê; off desativa o Bonjour."
  PINGKIT_SSDP:
    name: "Descoberta UPnP (SSDP)"
    description: "Escutar dispositivos UPnP. Padrão on."
  PINGKIT_STATUS_PAGE:
    name: "Página de status"
    description: "off desativa totalmente a página de status. Padrão on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Alertas de Dispositivo offline"
    description: "Avisar quando um dispositivo sai da sua rede. Um dispositivo é dado como offline quando não responde a três varreduras seguidas, o que pode levar até 45 minutos com a varredura padrão. Padrão off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Varreduras sem resposta até offline"
    description: "Padrão 3."
  PINGKIT_LEARNING_DAYS:
    name: "Dias de aprendizado"
    description: "Dias em que o agente aprende seus dispositivos antes de começarem os alertas de Novo dispositivo. Padrão 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Alertas por hora"
    description: "O máximo de alertas que o agente envia em uma hora. Padrão 60."
  PINGKIT_WORKER_URL:
    name: "Endereço do encaminhamento"
    description: "Somente para desenvolvimento. Deixe em branco."
  PINGKIT_LOG_LEVEL:
    name: "Nível de log"
    description: "Padrão info."
  PINGKIT_LOG_FORMAT:
    name: "Formato do log"
    description: "json ou text. Padrão json."
  PINGKIT_LOCALE:
    name: "Idioma da página de status"
    description: "Um código de idioma como de ou pt-BR. Vazio: o idioma do navegador e, se não houver, inglês."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Deixe vazio para usar o app Mosquitto no Home Assistant. Caso contrário, mqtt://host:1883 ou mqtts://host:8883, ou off para não usar MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Nome de usuário MQTT"
    description: "Somente para um broker indicado acima. O Mosquitto no Home Assistant não precisa de nada aqui."
  PINGKIT_MQTT_PASSWORD:
    name: "Senha MQTT"
    description: "Somente para um broker indicado acima. O Mosquitto no Home Assistant não precisa de nada aqui."
  PINGKIT_MQTT_TRACKERS:
    name: "Rastreadores de presença"
    description: "personal dá um rastreador a celulares, tablets e tudo o que usa um endereço Wi-Fi privado; all a todos os dispositivos; none os desativa."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Segundos até ausente"
    description: "Quanto tempo um dispositivo rastreado continua em casa após a última resposta, para que um celular em repouso não pareça ausente. Padrão 180."
  PINGKIT_NOTIFY_URLS:
    name: "Destinos de notificação"
    description: "Para onde o agente também envia alertas: uma URL por linha para ntfy, Telegram, Discord, Pushover, um webhook ou Apprise. Não precisa de assinatura."
  PINGKIT_SPEED_TEST:
    name: "Teste de velocidade"
    description: "daily faz um teste por dia em um minuto aleatório e quando você pede pelo iPhone; manual só quando você pede, para uma conexão com limite de dados; off nunca faz nenhum."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Limite de dados do teste de velocidade"
    description: "O máximo que os testes de velocidade podem usar em um mês do calendário, em megabytes. Depois disso, nenhum teste começa. Padrão 10000."
network:
  7474/tcp: "Página de status (HTTP)"
  7475/tcp: "Conexão do iPhone (HTTPS)"
