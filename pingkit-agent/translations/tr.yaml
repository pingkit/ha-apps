  PINGKIT_OFFLINE_THRESHOLD:
    name: "Çevrimdışı sayılmadan önce yanıtsız tarama"
    description: "Varsayılan 3."
  PINGKIT_LEARNING_DAYS:
    name: "Öğrenme günleri"
    description: "Yeni Cihaz uyarıları başlamadan önce Agent'ın cihazlarınızı öğrendiği gün sayısı. Varsayılan 1."
