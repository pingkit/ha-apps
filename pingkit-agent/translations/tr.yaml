    description: "Agent'ın bir saatte gönderdiği en fazla uyarı sayısı. Varsayılan 60."
  PINGKIT_WORKER_URL:
    name: "Aktarım adresi"
    description: "Yalnızca geliştirme için. Boş bırakın."
  PINGKIT_LOG_LEVEL:
    name: "Günlük düzeyi"
    description: "Varsayılan info."
  PINGKIT_LOG_FORMAT:
    name: "Günlük biçimi"
    description: "json veya text. Varsayılan json."
  PINGKIT_LOCALE:
    name: "Durum sayfası dili"
    description: "de veya pt-BR gibi bir dil kodu. Boş: tarayıcının dili, yoksa İngilizce."
  PINGKIT_MQTT_URL:
    name: "MQTT aracısı"
    description: "Home Assistant'taki Mosquitto uygulamasını kullanmak için boş bırakın. Aksi halde mqtt://host:1883 veya mqtts://host:8883, MQTT kullanmamak için off yazın."
  PINGKIT_MQTT_USERNAME:
    name: "MQTT kullanıcı adı"
    description: "Yalnızca yukarıda belirttiğiniz aracı için. Home Assistant'taki Mosquitto burada bir şey gerektirmez."
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT parolası"
    description: "Yalnızca yukarıda belirttiğiniz aracı için. Home Assistant'taki Mosquitto burada bir şey gerektirmez."
  PINGKIT_MQTT_TRACKERS:
    name: "Varlık izleyicileri"
    description: "personal telefonlara, tabletlere ve özel Wi-Fi adresi kullanan her şeye izleyici verir; all her cihaza verir; none kapatır."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Uzakta sayılmadan önceki saniye"
    description: "İzlenen cihazın son yanıtından sonra ne kadar evde sayılacağı; uykudaki telefon uzakta görünmesin diye. Varsayılan 180."
  PINGKIT_NOTIFY_URLS:
    name: "Bildirim hedefleri"
    description: "Agent'ın uyarılarını ayrıca gönderdiği yerler: ntfy, Telegram, Discord, Pushover, bir webhook veya Apprise için satır başına bir URL. Abonelik gerekmez."
  PINGKIT_SPEED_TEST:
    name: "Hız testi"
    description: "daily günde bir kez rastgele bir dakikada ve iPhone'dan istediğinizde test yapar; manual yalnızca siz istediğinizde, veri kotası olan bir bağlantı için; off hiçbir zaman test yapmaz."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Hız testi veri sınırı"
    description: "Hız testlerinin bir takvim ayında kullanabileceği en fazla miktar, megabayt olarak. Bu sınıra ulaşıldığında hiçbir test başlamaz. Varsayılan 10000."
network:
  7474/tcp: "Durum sayfası (HTTP)"
  7475/tcp: "iPhone bağlantısı (HTTPS)"
