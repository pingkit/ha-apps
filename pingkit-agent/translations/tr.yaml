    description: "iPhone'unuzun Agent'a bağlandığı HTTPS portu. Varsayılan 7475."
  PINGKIT_BIND:
    name: "Dinleme adresi"
    description: "Durum sayfasının adresi. Varsayılan 0.0.0.0. iPhone bağlantısı her zaman tüm arayüzlerde dinler."
