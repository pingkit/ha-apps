    description: "Komşu (ARP) tablosu okumaları arasındaki saniye. Varsayılan 30."
  PINGKIT_PING_INTERVAL:
    name: "İnternet denetimi aralığı (saniye)"
    description: "İnternet denetimleri arasındaki saniye. Varsayılan 60."
  PINGKIT_INTERNET_HOSTS:
    name: "İnternet denetimi adresleri"
    description: "Virgülle ayrılmış bir ila dört IP adresi. Varsayılan 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto, sistemin izin verdiği yerde ping, aksi halde ARP ve TCP denetimleri kullanır; off hiç ping göndermez."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto dinler ve Agent'ı iPhone'unuza görünür kılar; active yalnızca sorgu gönderir, bu yüzden iPhone'unuz onu görmez; off Bonjour'u kapatır."
