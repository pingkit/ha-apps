    name: "Eşleştirme kodu"
    description: "PingKit'in iPhone'unuzda Agent'lar, Agent Ekle altında gösterdiği 8 karakterli kod. Bir kez çalışır ve 10 dakika sonra geçersiz olur; eşleştirmeden sonra silebilirsiniz."
  PINGKIT_PORT:
