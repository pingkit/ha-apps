# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "קוד שיוך"
    description: "הקוד בן 8 התווים ש-PingKit מציג ב-iPhone שלך תחת סוכנים, הוספת סוכן. הוא עובד פעם אחת ופג אחרי 10 דקות; אפשר למחוק אותו אחרי השיוך."
  PINGKIT_PORT:
    name: "פורט דף המצב"
    description: "הפורט של דף המצב (HTTP). ברירת מחדל 7474."
  PINGKIT_API_PORT:
    name: "פורט החיבור של ה-iPhone"
    description: "פורט ה-HTTPS שדרכו ה-iPhone שלך מתחבר לסוכן. ברירת מחדל 7475."
  PINGKIT_BIND:
    name: "כתובת האזנה"
    description: "הכתובת של דף המצב. ברירת מחדל 0.0.0.0. החיבור של iPhone מאזין תמיד בכל הממשקים."
  PINGKIT_IFACE:
    name: "ממשק רשת"
    description: "הממשק שבמעקב, למשל end0 או eth0. ברירת המחדל היא הממשק של נתיב ברירת המחדל."
  PINGKIT_SWEEP_INTERVAL:
    name: "מרווח סריקה (שניות)"
    description: "שניות בין סריקות פעילות של הרשת שלך. ברירת מחדל 900 (15 דקות)."
  PINGKIT_ARP_INTERVAL:
    name: "מרווח טבלת השכנים (שניות)"
    description: "שניות בין קריאות של טבלת השכנים (ARP). ברירת מחדל 30."
  PINGKIT_PING_INTERVAL:
    name: "מרווח בדיקת האינטרנט (שניות)"
    description: "שניות בין בדיקות אינטרנט. ברירת מחדל 60."
  PINGKIT_INTERNET_HOSTS:
    name: "כתובות לבדיקת האינטרנט"
    description: "כתובת IP אחת עד ארבע, מופרדות בפסיקים. ברירת מחדל 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto משתמש ב-ping במקום שהמערכת מתירה, ואחרת בבדיקות ARP ו-TCP; off אף פעם לא שולח ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto מאזין והופך את הסוכן לגלוי ל-iPhone שלך; active רק שולח שאילתות, ולכן ה-iPhone שלך לא רואה אותו; off מכבה את Bonjour."
  PINGKIT_SSDP:
    name: "גילוי UPnP (SSDP)"
    description: "האזנה למכשירי UPnP. ברירת מחדל on."
  PINGKIT_STATUS_PAGE:
    name: "דף מצב"
    description: "off מכבה את דף המצב לגמרי. ברירת מחדל on."
  PINGKIT_OFFLINE_ALERTS:
    name: "התראות מכשיר לא מקוון"
    description: "התראה כשמכשיר עוזב את הרשת שלך. מכשיר מדווח כלא מקוון אחרי שלוש סריקות שהוחמצו, וזה יכול לקחת עד 45 דקות במרווח ברירת המחדל. ברירת מחדל off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "סריקות שהוחמצו לפני לא מקוון"
    description: "ברירת מחדל 3."
  PINGKIT_LEARNING_DAYS:
    name: "ימי למידה"
    description: "ימים שבהם הסוכן לומד את המכשירים שלך לפני שהתראות מכשיר חדש מתחילות. ברירת מחדל 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "התראות לשעה"
    description: "המספר המרבי של התראות שהסוכן שולח בשעה. ברירת מחדל 60."
  PINGKIT_WORKER_URL:
    name: "כתובת הממסר"
    description: "לפיתוח בלבד. השאר ריק."
  PINGKIT_LOG_LEVEL:
    name: "רמת יומן"
    description: "ברירת מחדל info."
  PINGKIT_LOG_FORMAT:
    name: "תבנית יומן"
    description: "json או text. ברירת מחדל json."
  PINGKIT_LOCALE:
    name: "שפת דף המצב"
    description: "קוד שפה כמו de או pt-BR. אם השדה ריק, הדף מוצג בשפת הדפדפן, ובאנגלית אם השפה הזו אינה נתמכת."
  PINGKIT_MQTT_URL:
    name: "מתווך MQTT"
    description: "השאר ריק כדי להשתמש באפליקציית Mosquitto ב-Home Assistant. אחרת mqtt://host:1883 או mqtts://host:8883, או off ללא MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "שם משתמש MQTT"
    description: "רק עבור מתווך שציינת למעלה. Mosquitto ב-Home Assistant לא צריך כאן כלום."
  PINGKIT_MQTT_PASSWORD:
    name: "סיסמת MQTT"
    description: "רק עבור מתווך שציינת למעלה. Mosquitto ב-Home Assistant לא צריך כאן כלום."
  PINGKIT_MQTT_TRACKERS:
    name: "מעקב נוכחות"
    description: "personal נותן מעקב לטלפונים, לטאבלטים ולכל מה שמשתמש בכתובת Wi-Fi פרטית; all לכל מכשיר; none מכבה אותו."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "שניות עד היעדרות"
    description: "כמה זמן מכשיר במעקב נשאר בבית אחרי התשובה האחרונה שלו, כדי שטלפון במצב שינה לא ייראה כמי שעזב. ברירת מחדל 180."
  PINGKIT_NOTIFY_URLS:
    name: "יעדי התראות"
    description: "לאן הסוכן שולח גם את ההתראות שלו: כתובת URL אחת בכל שורה עבור ntfy, Telegram, Discord, Pushover, webhook או Apprise. לא נדרש מינוי."
  PINGKIT_SPEED_TEST:
    name: "בדיקת מהירות"
    description: "daily: בדיקה אחת ביום בדקה אקראית, וגם כשמבקשים מה-iPhone; manual: רק כשמבקשים, לחיבור עם מגבלת נתונים; off: אף פעם."
  PINGKIT_SPEED_BUDGET_MB:
    name: "מכסת נתונים לבדיקת מהירות"
    description: "הכמות המרבית שבדיקות המהירות רשאיות לצרוך בחודש קלנדרי, במגה-בייט. לאחר שהיא מנוצלת, אף בדיקה לא מתחילה. ברירת מחדל 10000."
network:
  7474/tcp: "דף מצב (HTTP)"
  7475/tcp: "חיבור iPhone (HTTPS)"
