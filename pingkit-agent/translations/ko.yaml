# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "페어링 코드"
    description: "iPhone의 PingKit에서 에이전트, 에이전트 추가에 표시되는 8자 코드입니다. 한 번만 사용할 수 있으며 10분 후 만료됩니다. 페어링 후에는 지워도 됩니다."
  PINGKIT_PORT:
    name: "상태 페이지 포트"
    description: "상태 페이지(HTTP)의 포트입니다. 기본값 7474."
  PINGKIT_API_PORT:
    name: "iPhone 연결 포트"
    description: "iPhone이 에이전트에 연결하는 HTTPS 포트입니다. 기본값 7475."
  PINGKIT_BIND:
    name: "수신 주소"
    description: "상태 페이지의 주소입니다. 기본값 0.0.0.0. iPhone 연결은 항상 모든 인터페이스에서 수신합니다."
  PINGKIT_IFACE:
    name: "네트워크 인터페이스"
    description: "감시할 인터페이스입니다(예: end0, eth0). 기본값은 기본 경로의 인터페이스입니다."
  PINGKIT_SWEEP_INTERVAL:
    name: "스캔 간격(초)"
    description: "네트워크를 능동 스캔하는 간격(초)입니다. 기본값 900(15분)."
  PINGKIT_ARP_INTERVAL:
    name: "이웃 테이블 간격(초)"
    description: "이웃(ARP) 테이블을 읽는 간격(초)입니다. 기본값 30."
  PINGKIT_PING_INTERVAL:
    name: "인터넷 확인 간격(초)"
    description: "인터넷을 확인하는 간격(초)입니다. 기본값 60."
  PINGKIT_INTERNET_HOSTS:
    name: "인터넷 확인 주소"
    description: "쉼표로 구분한 IP 주소 1~4개입니다. 기본값 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto는 시스템이 허용하면 ping을 사용하고, 그렇지 않으면 ARP와 TCP로 확인합니다. off는 ping을 보내지 않습니다."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto는 수신하고 iPhone에서 에이전트를 찾을 수 있게 합니다. active는 질의만 보내므로 iPhone에서 보이지 않습니다. off는 Bonjour를 끕니다."
  PINGKIT_SSDP:
    name: "UPnP 검색(SSDP)"
    description: "UPnP 기기를 수신합니다. 기본값 on."
  PINGKIT_STATUS_PAGE:
    name: "상태 페이지"
    description: "off는 상태 페이지를 완전히 끕니다. 기본값 on."
  PINGKIT_OFFLINE_ALERTS:
    name: "기기 오프라인 알림"
    description: "기기가 네트워크를 떠나면 알립니다. 기기는 스캔을 세 번 놓치면 오프라인으로 보고되며, 기본 간격에서는 최대 45분이 걸릴 수 있습니다. 기본값 off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "오프라인 전 놓친 스캔 수"
    description: "기본값 3."
  PINGKIT_LEARNING_DAYS:
    name: "학습 기간(일)"
    description: "새 기기 알림이 시작되기 전에 에이전트가 기기를 학습하는 일수입니다. 기본값 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "시간당 알림 수"
    description: "에이전트가 한 시간에 보내는 최대 알림 수입니다. 기본값 60."
  PINGKIT_WORKER_URL:
    name: "릴레이 주소"
    description: "개발 전용입니다. 비워 두세요."
  PINGKIT_LOG_LEVEL:
    name: "로그 수준"
    description: "기본값 info."
  PINGKIT_LOG_FORMAT:
    name: "로그 형식"
    description: "json 또는 text. 기본값 json."
  PINGKIT_LOCALE:
    name: "상태 페이지 언어"
    description: "de 또는 pt-BR 같은 언어 코드입니다. 비워 두면 브라우저 언어를 따르며, 지원하지 않는 언어이면 영어로 표시합니다."
  PINGKIT_MQTT_URL:
    name: "MQTT 브로커"
    description: "비워 두면 Home Assistant의 Mosquitto 앱을 사용합니다. 그 외에는 mqtt://host:1883 또는 mqtts://host:8883을 입력하고, MQTT를 쓰지 않으려면 off를 입력합니다."
  PINGKIT_MQTT_USERNAME:
    name: "MQTT 사용자 이름"
    description: "위에 지정한 브로커에만 해당합니다. Home Assistant의 Mosquitto는 입력할 필요가 없습니다."
  PINGKIT_MQTT_PASSWORD:
    name: "MQTT 암호"
    description: "위에 지정한 브로커에만 해당합니다. Home Assistant의 Mosquitto는 입력할 필요가 없습니다."
  PINGKIT_MQTT_TRACKERS:
    name: "재실 추적기"
    description: "personal은 휴대폰, 태블릿, 비공개 Wi-Fi 주소를 쓰는 모든 기기에 추적기를 만들고 all은 모든 기기에 만듭니다. none은 끕니다."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "부재로 판단하기까지의 시간(초)"
    description: "추적 기기가 마지막 응답 후 집에 있는 것으로 유지되는 시간입니다. 잠자기 중인 휴대폰이 부재로 표시되지 않게 합니다. 기본값 180."
  PINGKIT_NOTIFY_URLS:
    name: "알림 대상"
    description: "에이전트가 알림을 추가로 보낼 곳입니다. ntfy, Telegram, Discord, Pushover, 웹훅 또는 Apprise의 URL을 한 행에 하나씩 입력합니다. 구독이 필요하지 않습니다."
  PINGKIT_SPEED_TEST:
    name: "속도 테스트"
    description: "daily는 하루에 한 번 임의의 시각에, 그리고 iPhone에서 요청할 때 테스트합니다. manual은 요청할 때만 실행하며 데이터 한도가 있는 회선에 적합합니다. off는 실행하지 않습니다."
  PINGKIT_SPEED_BUDGET_MB:
    name: "속도 테스트 데이터 한도"
    description: "속도 테스트가 한 달(달력 기준)에 사용할 수 있는 최대량(MB)입니다. 한도에 도달하면 테스트가 시작되지 않습니다. 기본값 10000."
network:
  7474/tcp: "상태 페이지(HTTP)"
  7475/tcp: "iPhone 연결(HTTPS)"
