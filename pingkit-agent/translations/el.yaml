# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Κωδικός σύζευξης"
    description: "Ο κωδικός 8 χαρακτήρων που δείχνει το PingKit στο iPhone σας στην ενότητα Πράκτορες, Προσθήκη πράκτορα. Λειτουργεί μία φορά και λήγει μετά από 10 λεπτά· μπορείτε να τον σβήσετε μετά τη σύζευξη."
  PINGKIT_PORT:
    name: "Θύρα σελίδας κατάστασης"
    description: "Η θύρα της σελίδας κατάστασης (HTTP). Προεπιλογή 7474."
  PINGKIT_API_PORT:
    name: "Θύρα σύνδεσης iPhone"
    description: "Η θύρα HTTPS μέσω της οποίας το iPhone σας συνδέεται με τον πράκτορα. Προεπιλογή 7475."
  PINGKIT_BIND:
    name: "Διεύθυνση ακρόασης"
    description: "Η διεύθυνση της σελίδας κατάστασης. Προεπιλογή 0.0.0.0. Η σύνδεση του iPhone ακούει πάντα σε όλες τις διεπαφές."
  PINGKIT_IFACE:
    name: "Διεπαφή δικτύου"
    description: "Η διεπαφή που παρακολουθείται, για παράδειγμα end0 ή eth0. Προεπιλογή: η διεπαφή της προεπιλεγμένης διαδρομής."
  PINGKIT_SWEEP_INTERVAL:
    name: "Διάστημα σάρωσης (δευτερόλεπτα)"
    description: "Δευτερόλεπτα ανάμεσα σε ενεργές σαρώσεις του δικτύου σας. Προεπιλογή 900 (15 λεπτά)."
  PINGKIT_ARP_INTERVAL:
    name: "Διάστημα πίνακα γειτόνων (δευτερόλεπτα)"
    description: "Δευτερόλεπτα ανάμεσα σε αναγνώσεις του πίνακα γειτόνων (ARP). Προεπιλογή 30."
  PINGKIT_PING_INTERVAL:
    name: "Διάστημα ελέγχου Διαδικτύου (δευτερόλεπτα)"
    description: "Δευτερόλεπτα ανάμεσα σε ελέγχους του Διαδικτύου. Προεπιλογή 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Διευθύνσεις ελέγχου Διαδικτύου"
    description: "Μία έως τέσσερις διευθύνσεις IP, χωρισμένες με κόμματα. Προεπιλογή 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "Το auto χρησιμοποιεί ping όπου το επιτρέπει το σύστημα και αλλιώς ελέγχους ARP και TCP· το off δεν στέλνει ποτέ ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "Το auto ακούει και κάνει τον πράκτορα ορατό στο iPhone σας· το active στέλνει μόνο ερωτήματα, οπότε το iPhone σας δεν τον βλέπει· το off απενεργοποιεί το Bonjour."
  PINGKIT_SSDP:
    name: "Εντοπισμός UPnP (SSDP)"
    description: "Ακρόαση για συσκευές UPnP. Προεπιλογή on."
  PINGKIT_STATUS_PAGE:
    name: "Σελίδα κατάστασης"
    description: "Το off απενεργοποιεί εντελώς τη σελίδα κατάστασης. Προεπιλογή on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Ειδοποιήσεις «Συσκευή εκτός σύνδεσης»"
    description: "Ειδοποίηση όταν μια συσκευή φεύγει από το δίκτυό σας. Μια συσκευή δηλώνεται εκτός σύνδεσης όταν δεν απαντήσει σε τρεις διαδοχικές σαρώσεις, κάτι που με την προεπιλεγμένη σάρωση μπορεί να διαρκέσει έως 45 λεπτά. Προεπιλογή off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Σαρώσεις χωρίς απάντηση πριν από «Εκτός σύνδεσης»"
    description: "Προεπιλογή 3."
  PINGKIT_LEARNING_DAYS:
    name: "Ημέρες εκμάθησης"
    description: "Ημέρες που ο πράκτορας μαθαίνει τις συσκευές σας πριν ξεκινήσουν οι ειδοποιήσεις «Νέα συσκευή». Προεπιλογή 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Ειδοποιήσεις ανά ώρα"
    description: "Οι περισσότερες ειδοποιήσεις που στέλνει ο πράκτορας σε μία ώρα. Προεπιλογή 60."
  PINGKIT_WORKER_URL:
    name: "Διεύθυνση αναμεταδότη"
    description: "Μόνο για ανάπτυξη. Αφήστε το κενό."
  PINGKIT_LOG_LEVEL:
    name: "Επίπεδο καταγραφής"
    description: "Προεπιλογή info."
  PINGKIT_LOG_FORMAT:
    name: "Μορφή καταγραφής"
    description: "json ή text. Προεπιλογή json."
  PINGKIT_LOCALE:
    name: "Γλώσσα σελίδας κατάστασης"
    description: "Ένας κωδικός γλώσσας, όπως de ή pt-BR. Αν μείνει κενό, χρησιμοποιείται η γλώσσα του προγράμματος περιήγησης ή τα Αγγλικά, αν εκείνη δεν υποστηρίζεται."
  PINGKIT_MQTT_URL:
    name: "Μεσίτης MQTT"
    description: "Αφήστε το κενό για να χρησιμοποιηθεί η εφαρμογή Mosquitto στο Home Assistant. Αλλιώς mqtt://host:1883 ή mqtts://host:8883, ή off για καθόλου MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Όνομα χρήστη MQTT"
    description: "Μόνο για μεσίτη που ορίσατε παραπάνω. Το Mosquitto στο Home Assistant δεν χρειάζεται τίποτα εδώ."
  PINGKIT_MQTT_PASSWORD:
    name: "Συνθηματικό MQTT"
    description: "Μόνο για μεσίτη που ορίσατε παραπάνω. Το Mosquitto στο Home Assistant δεν χρειάζεται τίποτα εδώ."
  PINGKIT_MQTT_TRACKERS:
    name: "Παρακολούθηση παρουσίας"
    description: "Το personal δίνει παρακολούθηση σε τηλέφωνα, tablet και ό,τι χρησιμοποιεί ιδιωτική διεύθυνση Wi-Fi· το all σε κάθε συσκευή· το none την απενεργοποιεί."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Δευτερόλεπτα πριν από την απουσία"
    description: "Πόσο μένει στο σπίτι μια παρακολουθούμενη συσκευή μετά την τελευταία απάντησή της, ώστε ένα τηλέφωνο σε αδράνεια να μη φαίνεται απόν. Προεπιλογή 180."
  PINGKIT_NOTIFY_URLS:
    name: "Προορισμοί ειδοποιήσεων"
    description: "Πού στέλνει επίσης ο πράκτορας τις ειδοποιήσεις του: μία διεύθυνση URL ανά γραμμή για ntfy, Telegram, Discord, Pushover, webhook ή Apprise. Δεν απαιτείται συνδρομή."
  PINGKIT_SPEED_TEST:
    name: "Τεστ ταχύτητας"
    description: "daily: ένα τεστ την ημέρα σε τυχαίο λεπτό και όταν το ζητήσετε από το iPhone· manual: μόνο όταν το ζητήσετε, για σύνδεση με όριο δεδομένων· off: κανένα τεστ."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Όριο δεδομένων τεστ ταχύτητας"
    description: "Το μέγιστο που μπορούν να χρησιμοποιήσουν τα τεστ ταχύτητας σε έναν ημερολογιακό μήνα, σε megabyte. Μόλις εξαντληθεί, δεν ξεκινά κανένα τεστ. Προεπιλογή 10000."
network:
  7474/tcp: "Σελίδα κατάστασης (HTTP)"
  7475/tcp: "Σύνδεση iPhone (HTTPS)"
