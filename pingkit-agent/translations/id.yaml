    name: "Halaman status"
    description: "off mematikan halaman status sepenuhnya. Bawaan on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Peringatan Perangkat Offline"
    description: "Beri peringatan saat perangkat meninggalkan jaringan Anda. Perangkat dilaporkan offline setelah tiga pemindaian terlewat, yang bisa memakan waktu hingga 45 menit dengan pemindaian bawaan. Bawaan off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Pemindaian terlewat sebelum offline"
    description: "Bawaan 3."
  PINGKIT_LEARNING_DAYS:
    name: "Hari pembelajaran"
    description: "Jumlah hari agen mempelajari perangkat Anda sebelum peringatan Perangkat Baru dimulai. Bawaan 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Peringatan per jam"
    description: "Jumlah peringatan terbanyak yang dikirim agen dalam satu jam. Bawaan 60."
  PINGKIT_WORKER_URL:
    name: "Alamat relai"
    description: "Hanya untuk pengembangan. Biarkan kosong."
  PINGKIT_LOG_LEVEL:
    name: "Tingkat log"
    description: "Bawaan info."
  PINGKIT_LOG_FORMAT:
    name: "Format log"
    description: "json atau text. Bawaan json."
  PINGKIT_LOCALE:
    name: "Bahasa halaman status"
    description: "Kode bahasa seperti de atau pt-BR. Jika kosong, halaman mengikuti bahasa browser, atau bahasa Inggris jika bahasa browser tidak didukung."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Kosongkan untuk memakai aplikasi Mosquitto di Home Assistant. Selain itu mqtt://host:1883 atau mqtts://host:8883, atau off untuk tanpa MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Nama pengguna MQTT"
    description: "Hanya untuk broker yang disebut di atas. Mosquitto di Home Assistant tidak memerlukan apa pun di sini."
  PINGKIT_MQTT_PASSWORD:
    name: "Kata sandi MQTT"
    description: "Hanya untuk broker yang disebut di atas. Mosquitto di Home Assistant tidak memerlukan apa pun di sini."
  PINGKIT_MQTT_TRACKERS:
    name: "Pelacak kehadiran"
    description: "personal memberi pelacak pada ponsel, tablet, dan apa pun yang memakai alamat Wi-Fi pribadi; all pada semua perangkat; none mematikannya."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Detik sebelum dianggap pergi"
    description: "Berapa lama perangkat yang dilacak tetap dianggap di rumah setelah jawaban terakhirnya, agar ponsel yang tidur tidak dianggap pergi. Bawaan 180."
  PINGKIT_NOTIFY_URLS:
    name: "Tujuan notifikasi"
    description: "Tempat agen juga mengirim peringatannya: satu URL per baris untuk ntfy, Telegram, Discord, Pushover, webhook, atau Apprise. Tidak perlu langganan."
  PINGKIT_SPEED_TEST:
    name: "Tes kecepatan"
    description: "daily menjalankan satu tes per hari pada menit acak, dan saat Anda memintanya dari iPhone; manual hanya saat Anda memintanya, untuk koneksi dengan batas data; off tidak pernah menjalankannya."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Batas data tes kecepatan"
    description: "Jumlah maksimum yang boleh dipakai tes kecepatan dalam satu bulan kalender, dalam megabyte. Setelah tercapai, tidak ada tes yang dimulai. Bawaan 10000."
network:
  7474/tcp: "Halaman status (HTTP)"
  7475/tcp: "Koneksi iPhone (HTTPS)"
