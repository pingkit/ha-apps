configuration:
  PINGKIT_CLAIM_CODE:
    name: "Kode pemasangan"
    description: "Kode 8 karakter yang ditampilkan PingKit di iPhone Anda pada Agen, Tambah Agen. Kode berlaku sekali dan kedaluwarsa setelah 10 menit; Anda boleh menghapusnya setelah dipasangkan."
  PINGKIT_PORT:
    name: "Port halaman status"
    description: "Port halaman status (HTTP). Bawaan 7474."
  PINGKIT_API_PORT:
    name: "Port koneksi iPhone"
    description: "Port HTTPS tempat iPhone Anda terhubung ke agen. Bawaan 7475."
  PINGKIT_BIND:
    name: "Alamat dengar"
    description: "Alamat halaman status. Bawaan 0.0.0.0. Koneksi iPhone selalu mendengarkan di semua antarmuka."
  PINGKIT_IFACE:
    name: "Antarmuka jaringan"
    description: "Antarmuka yang dipantau, misalnya end0 atau eth0. Bawaan: antarmuka dengan rute bawaan."
  PINGKIT_SWEEP_INTERVAL:
    name: "Interval pemindaian (detik)"
    description: "Jeda dalam detik antara pemindaian aktif jaringan Anda. Bawaan 900 (15 menit)."
  PINGKIT_ARP_INTERVAL:
    name: "Interval tabel tetangga (detik)"
    description: "Jeda dalam detik antara pembacaan tabel tetangga (ARP). Bawaan 30."
  PINGKIT_PING_INTERVAL:
    name: "Interval pemeriksaan internet (detik)"
    description: "Jeda dalam detik antara pemeriksaan internet. Bawaan 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Alamat pemeriksaan internet"
    description: "Satu sampai empat alamat IP, dipisahkan koma. Bawaan 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto memakai ping jika sistem mengizinkannya, dan jika tidak, pemeriksaan ARP dan TCP; off tidak pernah mengirim ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto mendengarkan dan membuat agen terlihat oleh iPhone Anda; active hanya mengirim kueri, jadi iPhone Anda tidak melihatnya; off mematikan Bonjour."
  PINGKIT_SSDP:
    name: "Penemuan UPnP (SSDP)"
    description: "Dengarkan perangkat UPnP. Bawaan on."
