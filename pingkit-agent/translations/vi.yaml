# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Mã ghép nối"
    description: "Mã 8 ký tự mà PingKit trên iPhone của bạn hiển thị trong Agent, Thêm Agent. Mã dùng được một lần và hết hạn sau 10 phút; bạn có thể xóa mã sau khi ghép nối."
  PINGKIT_PORT:
    name: "Cổng của trang trạng thái"
    description: "Cổng của trang trạng thái (HTTP). Mặc định 7474."
  PINGKIT_API_PORT:
    name: "Cổng kết nối iPhone"
    description: "Cổng HTTPS mà iPhone của bạn dùng để kết nối với agent. Mặc định 7475."
  PINGKIT_BIND:
    name: "Địa chỉ lắng nghe"
    description: "Địa chỉ của trang trạng thái. Mặc định 0.0.0.0. Kết nối iPhone luôn lắng nghe trên mọi giao diện."
  PINGKIT_IFACE:
    name: "Giao diện mạng"
    description: "Giao diện cần theo dõi, ví dụ end0 hoặc eth0. Mặc định là giao diện có tuyến mặc định."
  PINGKIT_SWEEP_INTERVAL:
    name: "Chu kỳ quét (giây)"
    description: "Số giây giữa các lần quét chủ động mạng của bạn. Mặc định 900 (15 phút)."
  PINGKIT_ARP_INTERVAL:
    name: "Chu kỳ đọc bảng lân cận (giây)"
    description: "Số giây giữa các lần đọc bảng lân cận (ARP). Mặc định 30."
  PINGKIT_PING_INTERVAL:
    name: "Chu kỳ kiểm tra Internet (giây)"
    description: "Số giây giữa các lần kiểm tra Internet. Mặc định 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Địa chỉ kiểm tra Internet"
    description: "Một đến bốn địa chỉ IP, phân cách bằng dấu phẩy. Mặc định 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto dùng ping khi hệ thống cho phép, nếu không thì dùng kiểm tra ARP và TCP; off không bao giờ ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto lắng nghe và làm cho iPhone của bạn thấy được agent; active chỉ gửi truy vấn nên iPhone của bạn không thấy nó; off tắt Bonjour."
  PINGKIT_SSDP:
    name: "Khám phá UPnP (SSDP)"
    description: "Lắng nghe thiết bị UPnP. Mặc định on."
  PINGKIT_STATUS_PAGE:
    name: "Trang trạng thái"
    description: "off tắt hoàn toàn trang trạng thái. Mặc định on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Cảnh báo Thiết bị ngoại tuyến"
    description: "Cảnh báo khi một thiết bị rời mạng của bạn. Một thiết bị được báo ngoại tuyến sau ba lần quét bị lỡ, việc này có thể mất tới 45 phút với chu kỳ quét mặc định. Mặc định off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Số lần quét lỡ trước khi ngoại tuyến"
    description: "Mặc định 3."
  PINGKIT_LEARNING_DAYS:
    name: "Số ngày học"
    description: "Số ngày agent tìm hiểu thiết bị của bạn trước khi bắt đầu cảnh báo Thiết bị mới. Mặc định 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Cảnh báo mỗi giờ"
    description: "Số cảnh báo nhiều nhất mà agent gửi trong một giờ. Mặc định 60."
  PINGKIT_WORKER_URL:
    name: "Địa chỉ bộ chuyển tiếp"
    description: "Chỉ dành cho phát triển. Để trống."
  PINGKIT_LOG_LEVEL:
    name: "Mức nhật ký"
    description: "Mặc định info."
  PINGKIT_LOG_FORMAT:
    name: "Định dạng nhật ký"
    description: "json hoặc text. Mặc định json."
  PINGKIT_LOCALE:
    name: "Ngôn ngữ trang trạng thái"
    description: "Mã ngôn ngữ như de hoặc pt-BR. Để trống thì dùng ngôn ngữ của trình duyệt, hoặc tiếng Anh nếu ngôn ngữ đó không được hỗ trợ."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Để trống để dùng ứng dụng Mosquitto trong Home Assistant. Nếu không, nhập mqtt://host:1883 hoặc mqtts://host:8883, hoặc off để không dùng MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Tên người dùng MQTT"
    description: "Chỉ dành cho broker đã nêu ở trên. Mosquitto trong Home Assistant không cần gì ở đây."
  PINGKIT_MQTT_PASSWORD:
    name: "Mật khẩu MQTT"
    description: "Chỉ dành cho broker đã nêu ở trên. Mosquitto trong Home Assistant không cần gì ở đây."
  PINGKIT_MQTT_TRACKERS:
    name: "Trình theo dõi hiện diện"
    description: "personal tạo trình theo dõi cho điện thoại, máy tính bảng và mọi thứ dùng địa chỉ Wi-Fi riêng tư; all cho mọi thiết bị; none tắt chúng."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Số giây trước khi coi là vắng mặt"
    description: "Thời gian thiết bị được theo dõi vẫn tính là ở nhà sau lần trả lời cuối, để điện thoại đang ngủ không bị coi là vắng mặt. Mặc định 180."
  PINGKIT_NOTIFY_URLS:
    name: "Đích thông báo"
    description: "Nơi agent cũng gửi cảnh báo: mỗi hàng một URL cho ntfy, Telegram, Discord, Pushover, webhook hoặc Apprise. Không cần gói đăng ký."
  PINGKIT_SPEED_TEST:
    name: "Kiểm tra tốc độ"
    description: "daily chạy một lần kiểm tra mỗi ngày vào một phút ngẫu nhiên và khi bạn yêu cầu từ iPhone; manual chỉ chạy khi bạn yêu cầu, dành cho kết nối có giới hạn dữ liệu; off không bao giờ chạy."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Giới hạn dữ liệu kiểm tra tốc độ"
    description: "Lượng dữ liệu tối đa mà các lần kiểm tra tốc độ được dùng trong một tháng dương lịch, tính bằng megabyte. Khi đạt giới hạn, không lần kiểm tra nào bắt đầu. Mặc định 10000."
network:
  7474/tcp: "Trang trạng thái (HTTP)"
  7475/tcp: "Kết nối iPhone (HTTPS)"
