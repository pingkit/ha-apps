# Generated by scripts/export-agent-strings.py from translations/en.yaml and
# scripts/l10n/agent-strings.json (lane H-L10n). Edit those and run the script; an
# edit here is overwritten. Home Assistant reads translations/<language>.yaml.
configuration:
  PINGKIT_CLAIM_CODE:
    name: "Code d'association"
    description: "Le code de 8 caractères que PingKit affiche sur votre iPhone sous Agents, Ajouter un agent. Il ne sert qu'une fois et expire au bout de 10 minutes ; vous pouvez l'effacer après l'association."
  PINGKIT_PORT:
    name: "Port de la page d'état"
    description: "Le port de la page d'état (HTTP). Par défaut : 7474."
  PINGKIT_API_PORT:
    name: "Port de connexion de l'iPhone"
    description: "Le port HTTPS par lequel votre iPhone se connecte à l'agent. Par défaut : 7475."
  PINGKIT_BIND:
    name: "Adresse d'écoute"
    description: "L'adresse de la page d'état. Par défaut : 0.0.0.0. La connexion de l'iPhone écoute toujours sur toutes les interfaces."
  PINGKIT_IFACE:
    name: "Interface réseau"
    description: "L'interface à surveiller, par exemple end0 ou eth0. Par défaut : celle de la route par défaut."
  PINGKIT_SWEEP_INTERVAL:
    name: "Intervalle d'analyse (secondes)"
    description: "Secondes entre deux analyses actives de votre réseau. Par défaut : 900 (15 minutes)."
  PINGKIT_ARP_INTERVAL:
    name: "Intervalle de la table des voisins (secondes)"
    description: "Secondes entre deux lectures de la table des voisins (ARP). Par défaut : 30."
  PINGKIT_PING_INTERVAL:
    name: "Intervalle de vérification d'Internet (secondes)"
    description: "Secondes entre deux vérifications d'Internet. Par défaut : 60."
  PINGKIT_INTERNET_HOSTS:
    name: "Adresses de vérification d'Internet"
    description: "Une à quatre adresses IP, séparées par des virgules. Par défaut : 1.1.1.1,8.8.8.8."
  PINGKIT_ICMP:
    name: "Ping"
    description: "auto utilise le ping là où le système le permet et sinon des vérifications ARP et TCP ; off n'envoie jamais de ping."
  PINGKIT_MDNS:
    name: "Bonjour (mDNS)"
    description: "auto écoute et rend l'agent visible par votre iPhone ; active envoie seulement des requêtes, votre iPhone ne le voit donc pas ; off désactive Bonjour."
  PINGKIT_SSDP:
    name: "Découverte UPnP (SSDP)"
    description: "Écouter les annonces des appareils UPnP. Par défaut : on."
  PINGKIT_STATUS_PAGE:
    name: "Page d'état"
    description: "off désactive complètement la page d'état. Par défaut : on."
  PINGKIT_OFFLINE_ALERTS:
    name: "Alertes « Appareil hors ligne »"
    description: "Alerter quand un appareil quitte votre réseau. Un appareil est signalé hors ligne après trois analyses manquées, ce qui peut prendre jusqu'à 45 minutes avec l'intervalle par défaut. Par défaut : off."
  PINGKIT_OFFLINE_THRESHOLD:
    name: "Analyses manquées avant « hors ligne »"
    description: "Par défaut : 3."
  PINGKIT_LEARNING_DAYS:
    name: "Jours d'apprentissage"
    description: "Jours pendant lesquels l'agent apprend vos appareils avant le début des alertes « Nouvel appareil ». Par défaut : 1."
  PINGKIT_EVENTS_PER_HOUR:
    name: "Alertes par heure"
    description: "Le nombre maximal d'alertes que l'agent envoie en une heure. Par défaut : 60."
  PINGKIT_WORKER_URL:
    name: "Adresse du relais"
    description: "Réservé au développement. Laissez vide."
  PINGKIT_LOG_LEVEL:
    name: "Niveau de journalisation"
    description: "Par défaut : info."
  PINGKIT_LOG_FORMAT:
    name: "Format du journal"
    description: "json ou text. Par défaut : json."
  PINGKIT_LOCALE:
    name: "Langue de la page d'état"
    description: "Un code de langue comme de ou pt-BR. Vide : la langue du navigateur, sinon l'anglais."
  PINGKIT_MQTT_URL:
    name: "Broker MQTT"
    description: "Laissez vide pour utiliser l'app Mosquitto de Home Assistant. Sinon mqtt://host:1883 ou mqtts://host:8883, ou off pour ne pas utiliser MQTT."
  PINGKIT_MQTT_USERNAME:
    name: "Nom d'utilisateur MQTT"
    description: "Uniquement pour un broker indiqué ci-dessus. Mosquitto dans Home Assistant n'a besoin de rien ici."
  PINGKIT_MQTT_PASSWORD:
    name: "Mot de passe MQTT"
    description: "Uniquement pour un broker indiqué ci-dessus. Mosquitto dans Home Assistant n'a besoin de rien ici."
  PINGKIT_MQTT_TRACKERS:
    name: "Suivi de présence"
    description: "personal donne un suivi aux téléphones, aux tablettes et à tout ce qui utilise une adresse Wi-Fi privée ; all à tous les appareils ; none le désactive."
  PINGKIT_MQTT_CONSIDER_HOME:
    name: "Secondes avant absence"
    description: "Durée pendant laquelle un appareil suivi reste à la maison après sa dernière réponse, pour qu'un téléphone en veille ne paraisse pas absent. Par défaut : 180."
  PINGKIT_NOTIFY_URLS:
    name: "Destinations des notifications"
    description: "Où l'agent envoie aussi ses alertes : une URL par ligne pour ntfy, Telegram, Discord, Pushover, un webhook ou Apprise. Aucun abonnement requis."
  PINGKIT_SPEED_TEST:
    name: "Test de vitesse"
    description: "daily lance un test par jour à une minute aléatoire, et quand vous le demandez depuis l'iPhone ; manual uniquement quand vous le demandez, pour une connexion avec un plafond de données ; off n'en lance jamais."
  PINGKIT_SPEED_BUDGET_MB:
    name: "Budget de données du test de vitesse"
    description: "Le maximum que les tests de vitesse peuvent utiliser par mois civil, en mégaoctets. Une fois atteint, aucun test ne démarre. Par défaut 10000."
network:
  7474/tcp: "Page d'état (HTTP)"
  7475/tcp: "Connexion de l'iPhone (HTTPS)"
